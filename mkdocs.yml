site_name: myNotes
site_url: https://JanikHenz.github.io/myNotes/ 
repo_url: https://github.com/JanikHenz/myNotes 

theme:
  name: material
  palette:
    scheme: slate  
    primary: deep orange
    accent: deep orange
  features:
    - navigation.sections 
    - navigation.expand 
    - search.suggest 

markdown_extensions:
  - admonition 
  - codehilite 

nav:
  - Home: index.md 
  - Neovim Config:
    - Grundlagen: neovim/basics.md
    - Plugins: neovim/plugins.md
  - ip5:
    - projectdeclaration: ip5/projectdeclaration.md
    - risks: ip5/risks.md
    - setup: ip5/setup.md
    - helper: ip5/helper.md
    - milestone01: ip5/milestone01.md
