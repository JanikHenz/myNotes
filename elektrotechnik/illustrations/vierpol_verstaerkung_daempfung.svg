<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Vierpol-Grundmodell (Verstärkung &amp; Dämpfung in dB)</text>

  <!-- Left: Quadripole Box -->
  <g transform="translate(25, 55)">
    <!-- Central Quadripole Block -->
    <rect x="75" y="25" width="120" height="85" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="135" y="65" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Vierpol</text>
    <text x="135" y="82" font-size="10" fill="#64748b" text-anchor="middle">(Verstärker / Filter)</text>

    <!-- Input Leads -->
    <line x1="20" y1="45" x2="75" y2="45" stroke="#1e293b" stroke-width="2" />
    <line x1="20" y1="90" x2="75" y2="90" stroke="#1e293b" stroke-width="2" />
    <circle cx="20" cy="45" r="3" fill="#2563eb" />
    <circle cx="20" cy="90" r="3" fill="#2563eb" />
    <text x="10" y="72" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="end">U_e</text>
    <line x1="18" y1="52" x2="18" y2="83" stroke="#2563eb" stroke-width="1.5" />

    <!-- Output Leads -->
    <line x1="195" y1="45" x2="250" y2="45" stroke="#1e293b" stroke-width="2" />
    <line x1="195" y1="90" x2="250" y2="90" stroke="#1e293b" stroke-width="2" />
    <circle cx="250" cy="45" r="3" fill="#dc2626" />
    <circle cx="250" cy="90" r="3" fill="#dc2626" />
    <text x="260" y="72" font-size="11" font-weight="bold" fill="#dc2626">U_a</text>
    <line x1="252" y1="52" x2="252" y2="83" stroke="#dc2626" stroke-width="1.5" />
  </g>

  <!-- Right: dB Formulas -->
  <rect x="330" y="55" width="215" height="175" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="345" y="80" font-size="12" font-weight="bold" fill="#0f172a">Dezibel-Berechnung:</text>

  <text x="345" y="105" font-size="11" fill="#2563eb" font-weight="bold">Spannungsverstärkung:</text>
  <text x="345" y="125" font-size="13" font-weight="bold" fill="#0f172a">A_u = 20 · lg(U_a / U_e)</text>

  <line x1="345" y1="138" x2="530" y2="138" stroke="#e2e8f0" stroke-width="1" />

  <text x="345" y="158" font-size="11" fill="#dc2626" font-weight="bold">Leistungsverstärkung:</text>
  <text x="345" y="178" font-size="13" font-weight="bold" fill="#0f172a">A_p = 10 · lg(P_a / P_e)</text>
  <text x="345" y="202" font-size="10" fill="#16a34a" font-weight="bold">Beispiel: U_a / U_e = 100 ⇒ +40 dB</text>
</svg>