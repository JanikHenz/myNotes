<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Der ideale Operationsverstärker (OPV)</text>
  <!-- OpAmp Triangle -->
  <polygon points="160,70 160,210 280,140" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <!-- Inverting Input (-) -->
  <line x1="80" y1="105" x2="160" y2="105" stroke="#1e293b" stroke-width="2" />
  <circle cx="80" cy="105" r="4" fill="#1e293b" />
  <text x="50" y="110" font-size="14" font-weight="bold" fill="#1e293b">U₋</text>
  <text x="175" y="110" font-size="16" font-weight="bold" fill="#1e293b">−</text>
  <!-- Non-inverting Input (+) -->
  <line x1="80" y1="175" x2="160" y2="175" stroke="#1e293b" stroke-width="2" />
  <circle cx="80" cy="175" r="4" fill="#1e293b" />
  <text x="50" y="180" font-size="14" font-weight="bold" fill="#1e293b">U₊</text>
  <text x="175" y="180" font-size="16" font-weight="bold" fill="#1e293b">+</text>
  <!-- Output -->
  <line x1="280" y1="140" x2="360" y2="140" stroke="#2563eb" stroke-width="2" />
  <circle cx="360" cy="140" r="4" fill="#2563eb" />
  <text x="370" y="145" font-size="14" font-weight="bold" fill="#2563eb">U_a</text>
  <!-- Ideal properties box -->
  <rect x="290" y="45" width="155" height="75" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="300" y="65" font-size="12" font-weight="bold" fill="#1e40af">Eigenschaften (ideal):</text>
  <text x="300" y="82" font-size="12" fill="#1e40af">• R_in = ∞ (I₊ = I₋ = 0)</text>
  <text x="300" y="97" font-size="12" fill="#1e40af">• R_out = 0</text>
  <text x="300" y="112" font-size="12" fill="#1e40af">• Verstärkung v_D = ∞</text>
</svg>