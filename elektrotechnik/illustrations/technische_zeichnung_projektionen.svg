<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Axonometrische Projektionsarten (Technisches Zeichnen)</text>

  <!-- 1. Isometrisch -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Isometrisch</text>
    
    <!-- Isometric Cube -->
    <g transform="translate(77, 95)">
      <!-- Top -->
      <polygon points="0,-35 35,-15 0,5 -35,-15" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
      <!-- Left -->
      <polygon points="-35,-15 0,5 0,45 -35,25" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5" />
      <!-- Right -->
      <polygon points="0,5 35,-15 35,25 0,45" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <text x="77" y="152" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">a : b : c = 1 : 1 : 1</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">Winkel: 30° / 30°</text>
  </g>

  <!-- 2. Dimetrisch -->
  <g transform="translate(197, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Dimetrisch</text>
    
    <!-- Dimetric Cube (shortened depth) -->
    <g transform="translate(77, 95)">
      <!-- Top -->
      <polygon points="-5,-38 42,-15 0,5 -47,-18" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
      <!-- Left -->
      <polygon points="-47,-18 0,5 0,45 -47,22" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5" />
      <!-- Right -->
      <polygon points="0,5 42,-15 42,25 0,45" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <text x="77" y="152" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">a : b : c = 0,5 : 1 : 1</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">Winkel: 7° / 42°</text>
  </g>

  <!-- 3. Kabinett -->
  <g transform="translate(365, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Kabinettperspektive</text>
    
    <!-- Cavalier / Cabinet Cube (Front flat) -->
    <g transform="translate(60, 95)">
      <!-- Front (unverzerrt 1:1) -->
      <rect x="-20" y="5" width="40" height="40" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5" />
      <!-- Top -->
      <polygon points="-20,5 0,-15 40,-15 20,5" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5" />
      <!-- Right -->
      <polygon points="20,5 40,-15 40,25 20,45" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5" />
    </g>

    <text x="77" y="152" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">a : b : c = 0,5 : 1 : 1</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">Winkel: 0° / 45° (Front 1:1)</text>
  </g>
</svg>