<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Schaltsymbole einstellbarer Widerstände (DIN EN 60617)</text>

  <!-- 1. Potentiometer -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="160" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="80" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Potentiometer</text>
    
    <!-- Symbol: Resistor with arrow wiper on side -->
    <line x1="25" y1="75" x2="55" y2="75" stroke="#1e293b" stroke-width="2" />
    <rect x="55" y="65" width="50" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="75" x2="135" y2="75" stroke="#1e293b" stroke-width="2" />

    <!-- Wiper arrow -->
    <line x1="80" y1="120" x2="80" y2="87" stroke="#dc2626" stroke-width="2" />
    <polygon points="80,87 76,96 84,96" fill="#dc2626" />

    <text x="80" y="145" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">3 Klemmen</text>
    <text x="80" y="165" font-size="10" fill="#64748b" text-anchor="middle">Spannungsteiler / Drehknopf</text>
  </g>

  <!-- 2. Trimmwiderstand -->
  <g transform="translate(195, 55)">
    <rect x="0" y="0" width="160" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="80" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Trimmwiderstand</text>

    <!-- Symbol: Resistor with preset adjustment stroke -->
    <line x1="25" y1="75" x2="55" y2="75" stroke="#1e293b" stroke-width="2" />
    <rect x="55" y="65" width="50" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="75" x2="135" y2="75" stroke="#1e293b" stroke-width="2" />

    <!-- Adjustment bar -->
    <line x1="60" y1="105" x2="100" y2="45" stroke="#1e293b" stroke-width="2" />
    <line x1="55" y1="105" x2="65" y2="105" stroke="#1e293b" stroke-width="2" />

    <text x="80" y="145" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Abgleich mit Schrauber</text>
    <text x="80" y="165" font-size="10" fill="#64748b" text-anchor="middle">Nur bei Kalibrierung</text>
  </g>

  <!-- 3. Stellwiderstand (Rheostat) -->
  <g transform="translate(370, 55)">
    <rect x="0" y="0" width="160" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="80" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Stellwiderstand</text>

    <!-- Symbol: Resistor with diagonal arrow through it -->
    <line x1="25" y1="75" x2="55" y2="75" stroke="#1e293b" stroke-width="2" />
    <rect x="55" y="65" width="50" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="75" x2="135" y2="75" stroke="#1e293b" stroke-width="2" />

    <!-- Continuous arrow -->
    <line x1="60" y1="105" x2="100" y2="45" stroke="#dc2626" stroke-width="2" />
    <polygon points="100,45 92,48 97,55" fill="#dc2626" />

    <text x="80" y="145" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">2 Klemmen (Rheostat)</text>
    <text x="80" y="165" font-size="10" fill="#64748b" text-anchor="middle">Reine Stromregelung</text>
  </g>
</svg>