<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Passive Filter 1. Ordnung (LR-Tiefpass &amp; RL-Hochpass)</text>

  <!-- Left: LR Low-pass -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="235" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Passiver LR-Tiefpass</text>
    
    <!-- Schematic -->
    <line x1="25" y1="65" x2="60" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="25" cy="65" r="3" fill="#2563eb" />
    <text x="15" y="69" font-size="10" font-weight="bold" fill="#2563eb">U_e</text>

    <!-- Inductor L -->
    <path d="M 60,65 A 8,8 0 0,1 76,65 A 8,8 0 0,1 92,65 A 8,8 0 0,1 108,65 A 8,8 0 0,1 124,65" fill="none" stroke="#1e293b" stroke-width="2" />
    <text x="92" y="50" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">L</text>

    <line x1="124" y1="65" x2="160" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="160" cy="65" r="3" fill="#dc2626" />
    <text x="170" y="69" font-size="10" font-weight="bold" fill="#dc2626">U_a</text>

    <!-- Resistor R to GND -->
    <line x1="145" y1="65" x2="145" y2="85" stroke="#1e293b" stroke-width="1.8" />
    <rect x="137" y="85" width="16" height="30" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="160" y="103" font-size="10" font-weight="bold" fill="#0f172a">R</text>
    <line x1="145" y1="115" x2="145" y2="130" stroke="#1e293b" stroke-width="1.8" />
    <!-- GND symbol -->
    <line x1="135" y1="130" x2="155" y2="130" stroke="#1e293b" stroke-width="2" />
    <line x1="140" y1="134" x2="150" y2="134" stroke="#1e293b" stroke-width="1.5" />

    <!-- Evaluation -->
    <text x="117" y="155" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">f_g = R / (2π · L)</text>
    <text x="117" y="175" font-size="10" fill="#64748b" text-anchor="middle">Tiefen Frequenzen passiert Signal ungehindert</text>
  </g>

  <!-- Right: RL High-pass -->
  <g transform="translate(285, 55)">
    <rect x="0" y="0" width="235" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Passiver RL-Hochpass</text>

    <!-- Schematic: R in series, L to GND -->
    <line x1="25" y1="65" x2="65" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="25" cy="65" r="3" fill="#2563eb" />
    <text x="15" y="69" font-size="10" font-weight="bold" fill="#2563eb">U_e</text>

    <rect x="65" y="57" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="82" y="50" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>

    <line x1="100" y1="65" x2="160" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="160" cy="65" r="3" fill="#dc2626" />
    <text x="170" y="69" font-size="10" font-weight="bold" fill="#dc2626">U_a</text>

    <!-- Inductor L to GND -->
    <line x1="145" y1="65" x2="145" y2="80" stroke="#1e293b" stroke-width="1.8" />
    <path d="M 145,80 A 6,6 0 0,1 145,92 A 6,6 0 0,1 145,104 A 6,6 0 0,1 145,116" fill="none" stroke="#1e293b" stroke-width="2" />
    <text x="160" y="102" font-size="10" font-weight="bold" fill="#0f172a">L</text>
    <line x1="145" y1="116" x2="145" y2="130" stroke="#1e293b" stroke-width="1.8" />
    <line x1="135" y1="130" x2="155" y2="130" stroke="#1e293b" stroke-width="2" />
    <line x1="140" y1="134" x2="150" y2="134" stroke="#1e293b" stroke-width="1.5" />

    <!-- Evaluation -->
    <text x="117" y="155" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">f_g = R / (2π · L)</text>
    <text x="117" y="175" font-size="10" fill="#64748b" text-anchor="middle">Flankensteilheit: −20 dB/Dekade</text>
  </g>
</svg>