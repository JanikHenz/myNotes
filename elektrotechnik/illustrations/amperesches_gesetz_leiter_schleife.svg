<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <marker id="arr-i" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="400" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Ampèresches Gesetz: Umlaufschleife um geraden Stromleiter
  </text>
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Geschlossene polygonale Integrationsschleife Σ B_i · ΔS_i = μ₀ · I_eing
  </text>

  <!-- Wire -->
  <line x1="400" y1="420" x2="400" y2="90" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <line x1="400" y1="420" x2="400" y2="90" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

  <!-- Current Arrow I -->
  <line x1="400" y1="360" x2="400" y2="120" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arr-i)"/>
  <rect x="415" y="130" width="60" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="445" y="148" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Strom I</text>

  <!-- Magnetic loop -->
  <ellipse cx="400" cy="270" rx="200" ry="85" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Polygonal path -->
  <polygon points="200,270 250,205 400,185 550,205 600,270 540,335 400,355 260,335" 
           fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="2.5"/>

  <!-- Arrows on segments -->
  <line x1="200" y1="270" x2="230" y2="230" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>
  <line x1="300" y1="195" x2="360" y2="187" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>
  <line x1="550" y1="205" x2="585" y2="250" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>
  <line x1="600" y1="270" x2="565" y2="310" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>
  <line x1="480" y1="348" x2="420" y2="355" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>
  <line x1="320" y1="348" x2="240" y2="320" stroke="#059669" stroke-width="2" marker-end="url(#arr-s)"/>

  <!-- Tangential B-field -->
  <line x1="600" y1="270" x2="600" y2="330" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-b)"/>
  <text x="615" y="315" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">B_i</text>
  <text x="500" y="375" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#047857">Teilstück ΔS_i</text>

  <!-- Formula Callout -->
  <rect x="60" y="85" width="250" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="75" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Ampèresches Gesetz:</text>
  <text x="75" y="138" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Σ B_i · ΔS_i = μ₀ · I_eing</text>
  <text x="75" y="165" font-family="system-ui, sans-serif" font-size="12" fill="#475569">B(r) = (μ₀ · I) / (2π · r)</text>
</svg>