<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-fld" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">Elektrische Feldlinien: Dipol vs. gleichnamige Ladungen</text>

  <!-- Left: Dipole (+ and -) -->
  <g transform="translate(140, 165)">
    <text x="0" y="-110" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Elektrischer Dipol (+ / −)</text>
    <!-- Field lines -->
    <path d="M -50,0 C -50,-60 50,-60 50,0" fill="none" stroke="#2563eb" stroke-width="1.8" marker-mid="url(#arr-fld)" />
    <path d="M -50,0 C -50,-100 50,-100 50,0" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <path d="M -50,0 C -50,60 50,60 50,0" fill="none" stroke="#2563eb" stroke-width="1.8" />
    <path d="M -50,0 C -50,100 50,100 50,0" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-fld)" />

    <!-- Charges -->
    <circle cx="-50" cy="0" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="-50" y="5" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
    <circle cx="50" cy="0" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="50" y="5" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  </g>

  <!-- Divider -->
  <line x1="280" y1="50" x2="280" y2="250" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Right: Like charges (+ and +) -->
  <g transform="translate(420, 165)">
    <text x="0" y="-110" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Gleichnamige Ladungen (+ / +)</text>
    <!-- Repelling curved field lines -->
    <path d="M -50,0 C -30,-40 -15,-80 -15,-100" fill="none" stroke="#2563eb" stroke-width="1.8" />
    <path d="M 50,0 C 30,-40 15,-80 15,-100" fill="none" stroke="#2563eb" stroke-width="1.8" />
    <path d="M -50,0 C -30,40 -15,80 -15,100" fill="none" stroke="#2563eb" stroke-width="1.8" />
    <path d="M 50,0 C 30,40 15,80 15,100" fill="none" stroke="#2563eb" stroke-width="1.8" />

    <!-- Neutral Zone -->
    <ellipse cx="0" cy="0" rx="18" ry="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="0" y="4" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Neutral (E=0)</text>

    <!-- Charges -->
    <circle cx="-50" cy="0" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="-50" y="5" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
    <circle cx="50" cy="0" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="50" y="5" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  </g>

  <!-- Bottom Merksatz -->
  <rect x="90" y="262" width="380" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="280" y="279" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Grundsatz: Feldlinien schneiden sich niemals!</text>
</svg>