<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- TIEFPASS (Left) -->
  <g transform="translate(30, 20)">
    <text x="100" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">RC-Tiefpass (1. Ordnung)</text>
    <circle cx="20" cy="60" r="4" fill="#1e293b" />
    <text x="10" y="50" font-size="12" fill="#1e293b">U_e</text>
    <line x1="20" y1="60" x2="50" y2="60" stroke="#1e293b" stroke-width="2" />
    <!-- Resistor R in series -->
    <rect x="50" y="50" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="70" y="65" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
    <line x1="90" y1="60" x2="160" y2="60" stroke="#1e293b" stroke-width="2" />
    <circle cx="160" cy="60" r="4" fill="#2563eb" />
    <text x="170" y="65" font-size="13" font-weight="bold" fill="#2563eb">U_a</text>
    <!-- Capacitor C to GND -->
    <circle cx="120" cy="60" r="3" fill="#1e293b" />
    <line x1="120" y1="60" x2="120" y2="90" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="90" x2="135" y2="90" stroke="#1e293b" stroke-width="3" />
    <line x1="105" y1="98" x2="135" y2="98" stroke="#1e293b" stroke-width="3" />
    <line x1="120" y1="98" x2="120" y2="130" stroke="#1e293b" stroke-width="2" />
    <text x="145" y="98" font-size="12" font-weight="bold" fill="#0f172a">C</text>
    <line x1="20" y1="130" x2="160" y2="130" stroke="#1e293b" stroke-width="2" />
    <!-- Frequency Curve Mini -->
    <rect x="30" y="150" width="140" height="60" fill="#f8fafc" stroke="#e2e8f0" rx="3" />
    <path d="M 40,165 L 100,165 Q 120,165 150,200" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="45" y="180" font-size="11" fill="#64748b">Durchlass</text>
    <text x="110" y="195" font-size="11" fill="#dc2626">Sperre</text>
    <text x="100" y="230" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">f_g = 1 / (2π · RC)</text>
  </g>
  <!-- HOCHPASS (Right) -->
  <g transform="translate(280, 20)">
    <text x="100" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">RC-Hochpass (1. Ordnung)</text>
    <circle cx="20" cy="60" r="4" fill="#1e293b" />
    <text x="10" y="50" font-size="12" fill="#1e293b">U_e</text>
    <line x1="20" y1="60" x2="60" y2="60" stroke="#1e293b" stroke-width="2" />
    <!-- Capacitor C in series -->
    <line x1="60" y1="48" x2="60" y2="72" stroke="#1e293b" stroke-width="3" />
    <line x1="68" y1="48" x2="68" y2="72" stroke="#1e293b" stroke-width="3" />
    <line x1="68" y1="60" x2="160" y2="60" stroke="#1e293b" stroke-width="2" />
    <text x="64" y="40" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">C</text>
    <circle cx="160" cy="60" r="4" fill="#2563eb" />
    <text x="170" y="65" font-size="13" font-weight="bold" fill="#2563eb">U_a</text>
    <!-- Resistor R to GND -->
    <circle cx="120" cy="60" r="3" fill="#1e293b" />
    <line x1="120" y1="60" x2="120" y2="80" stroke="#1e293b" stroke-width="2" />
    <rect x="110" y="80" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <line x1="120" y1="115" x2="120" y2="130" stroke="#1e293b" stroke-width="2" />
    <text x="140" y="102" font-size="12" font-weight="bold" fill="#0f172a">R</text>
    <line x1="20" y1="130" x2="160" y2="130" stroke="#1e293b" stroke-width="2" />
    <!-- Frequency Curve Mini -->
    <rect x="30" y="150" width="140" height="60" fill="#f8fafc" stroke="#e2e8f0" rx="3" />
    <path d="M 40,200 Q 70,165 90,165 L 160,165" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="45" y="195" font-size="11" fill="#dc2626">Sperre</text>
    <text x="110" y="180" font-size="11" fill="#64748b">Durchlass</text>
    <text x="100" y="230" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">f_g = 1 / (2π · RC)</text>
  </g>
</svg>