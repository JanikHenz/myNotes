<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Ausgangskennlinienfeld des Bipolartransistors (IC über UCE)</text>

  <!-- Graph Area -->
  <g transform="translate(50, 50)">
    <!-- Axes -->
    <line x1="40" y1="160" x2="300" y2="160" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-dark)" />
    <line x1="40" y1="160" x2="40" y2="20" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-dark)" />
    <text x="305" y="165" font-size="12" font-weight="bold" fill="#1e293b">U_CE [V]</text>
    <text x="25" y="15" font-size="12" font-weight="bold" fill="#1e293b">I_C [mA]</text>
    <text x="30" y="175" font-size="10" fill="#64748b">0</text>

    <!-- Transistor Characteristic Curves for IB3 > IB2 > IB1 -->
    <!-- IB3 -->
    <path d="M 40,160 Q 55,60 300,55" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="245" y="48" font-size="10" font-weight="bold" fill="#2563eb">I_B3 = 30 µA</text>

    <!-- IB2 -->
    <path d="M 40,160 Q 55,95 300,90" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="245" y="83" font-size="10" font-weight="bold" fill="#2563eb">I_B2 = 20 µA</text>

    <!-- IB1 -->
    <path d="M 40,160 Q 55,130 300,125" fill="none" stroke="#2563eb" stroke-width="2" />
    <text x="245" y="118" font-size="10" font-weight="bold" fill="#2563eb">I_B1 = 10 µA</text>

    <!-- Load Line (Arbeitsgerade rot) -->
    <line x1="40" y1="40" x2="260" y2="160" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2" />
    <text x="260" y="175" font-size="10" font-weight="bold" fill="#dc2626">U_CC</text>
    <text x="10" y="45" font-size="10" font-weight="bold" fill="#dc2626">I_C,max</text>

    <!-- Operating Point Q (Arbeitspunkt) -->
    <circle cx="150" cy="95" r="5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5" />
    <rect x="75" y="68" width="92" height="18" rx="3" fill="#ffffff" fill-opacity="0.9" />
    <text x="121" y="81" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Arbeitspunkt Q</text>

    <!-- Saturation zone indicator -->
    <rect x="40" y="20" width="25" height="140" fill="#cbd5e1" opacity="0.3" />
    <text x="52" y="145" font-size="8" fill="#475569" transform="rotate(-90 52 145)">Übersteuerung</text>
  </g>

  <!-- Right: Info Card -->
  <rect x="365" y="50" width="155" height="195" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="375" y="75" font-size="12" font-weight="bold" fill="#0f172a">Kennwerte:</text>
  <text x="375" y="98" font-size="11" fill="#dc2626" font-weight="bold">Arbeitspunkt Q:</text>
  <text x="375" y="114" font-size="10" fill="#334155">Optimale Lage in der</text>
  <text x="375" y="128" font-size="10" fill="#334155">Mitte der Kennlinie</text>
  <text x="375" y="142" font-size="10" fill="#16a34a">(verzerrungsfreie Class A)</text>

  <line x1="375" y1="152" x2="510" y2="152" stroke="#e2e8f0" stroke-width="1" />
  <text x="375" y="172" font-size="11" font-weight="bold" fill="#2563eb">Stromverstärkung:</text>
  <text x="375" y="190" font-size="12" font-weight="bold" fill="#0f172a">B = I_C / I_B</text>
</svg>