<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 295" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="bold" fill="#0f172a">Ladekennlinie des Kondensators: u(t) = U₀(1 - e^{-t/τ})</text>
  <!-- Axes -->
  <line x1="65" y1="235" x2="480" y2="235" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <line x1="65" y1="235" x2="65" y2="60" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <text x="485" y="240" font-size="13" font-weight="bold" fill="#1e293b">t</text>
  <text x="55" y="52" font-size="13" font-weight="bold" fill="#1e293b">u_C(t)</text>
  <!-- Asymptote U0 -->
  <line x1="65" y1="95" x2="455" y2="95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="35" y="100" font-size="13" font-weight="bold" fill="#dc2626">U₀</text>
  <!-- 63.2% mark -->
  <line x1="65" y1="146" x2="142" y2="146" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="142" y1="146" x2="142" y2="235" stroke="#2563eb" stroke-width="1" stroke-dasharray="3,3" />
  <text x="20" y="150" font-size="12" fill="#2563eb">63,2%</text>
  <text x="142" y="250" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">1τ = RC</text>
  <!-- 5 Tau mark -->
  <line x1="455" y1="95" x2="455" y2="235" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" />
  <text x="455" y="250" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">5τ (99%)</text>
  <!-- Charging Curve -->
  <path d="M 65,235 C 110,155 170,98 455,96" fill="none" stroke="#2563eb" stroke-width="3" />
  <circle cx="142" cy="146" r="4" fill="#2563eb" />
  <rect x="150" y="128" width="65" height="18" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="155" y="142" font-size="12" font-weight="bold" fill="#2563eb">0,632 U₀</text>
</svg>