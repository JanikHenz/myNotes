<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Bitmanipulation &amp; Register in C (Mikrocontroller)</text>

  <!-- 8-Bit Register Layout -->
  <g transform="translate(30, 50)">
    <text x="0" y="18" font-size="12" font-weight="bold" fill="#64748b">8-Bit Register (z. B. PORTB):</text>
    
    <!-- 8 Cells -->
    <g transform="translate(0, 25)">
      <!-- Cells 7 to 0 -->
      <rect x="0" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="27" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 7</text>
      <rect x="55" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="82" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 6</text>
      <rect x="110" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="137" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 5</text>
      <rect x="165" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="192" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 4</text>
      <rect x="220" y="0" width="55" height="32" fill="#fee2e2" stroke="#dc2626" stroke-width="2" /><text x="247" y="21" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Bit 3</text>
      <rect x="275" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="302" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 2</text>
      <rect x="330" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="357" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 1</text>
      <rect x="385" y="0" width="55" height="32" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" /><text x="412" y="21" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Bit 0</text>
      
      <!-- Values -->
      <text x="247" y="47" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">(1 &lt;&lt; 3)</text>
    </g>
  </g>

  <!-- Operations Card Box -->
  <g transform="translate(30, 140)">
    <rect x="0" y="0" width="490" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    
    <!-- Col 1: Set & Clear -->
    <text x="15" y="24" font-size="11" font-weight="bold" fill="#16a34a">1. Bit n setzen (auf 1):</text>
    <text x="15" y="42" font-size="12" font-family="monospace" fill="#0f172a">PORTB |= (1 &lt;&lt; n);</text>

    <text x="15" y="68" font-size="11" font-weight="bold" fill="#dc2626">2. Bit n löschen (auf 0):</text>
    <text x="15" y="86" font-size="12" font-family="monospace" fill="#0f172a">PORTB &amp;= ~(1 &lt;&lt; n);</text>

    <!-- Divider -->
    <line x1="245" y1="10" x2="245" y2="100" stroke="#e2e8f0" stroke-width="1" />

    <!-- Col 2: Toggle & Test -->
    <text x="260" y="24" font-size="11" font-weight="bold" fill="#2563eb">3. Bit n toggeln (invertieren):</text>
    <text x="260" y="42" font-size="12" font-family="monospace" fill="#0f172a">PORTB ^= (1 &lt;&lt; n);</text>

    <text x="260" y="68" font-size="11" font-weight="bold" fill="#eab308">4. Bit n abfragen (testen):</text>
    <text x="260" y="86" font-size="12" font-family="monospace" fill="#0f172a">if (PINB &amp; (1 &lt;&lt; n)) { ... }</text>
  </g>
</svg>