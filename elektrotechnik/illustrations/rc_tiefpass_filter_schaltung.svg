<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="100%" height="100%">
  <defs>
    <marker id="arr-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="410" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Passiver RC-Tiefpass 1. Ordnung
  </text>
  <text x="410" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Lässt tiefe Frequenzen passieren (U_a ≈ U_e) und bedämpft hohe Frequenzen (−20 dB/Dekade)
  </text>

  <!-- Circuit Left -->
  <rect x="40" y="85" width="410" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="245" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Schaltplan RC-Tiefpass</text>

  <!-- Terminals -->
  <circle cx="80" cy="160" r="5" fill="#1e293b"/><circle cx="80" cy="290" r="5" fill="#1e293b"/>
  <text x="60" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">X1-1</text>
  <text x="60" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">X1-2</text>

  <line x1="110" y1="280" x2="110" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-f)"/>
  <text x="125" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">U_e</text>

  <!-- R1 -->
  <line x1="80" y1="160" x2="160" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="160" y="148" width="60" height="24" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="190" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">R₁</text>
  <line x1="220" y1="160" x2="300" y2="160" stroke="#1e293b" stroke-width="2.5"/>

  <!-- C1 -->
  <circle cx="300" cy="160" r="4" fill="#1e293b"/>
  <line x1="300" y1="160" x2="300" y2="210" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="280" y1="210" x2="320" y2="210" stroke="#059669" stroke-width="3.5"/>
  <line x1="280" y1="222" x2="320" y2="222" stroke="#059669" stroke-width="3.5"/>
  <text x="335" y="220" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#059669">C₁</text>
  <line x1="300" y1="222" x2="300" y2="290" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="300" cy="290" r="4" fill="#1e293b"/>

  <line x1="80" y1="290" x2="400" y2="290" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Output -->
  <line x1="300" y1="160" x2="400" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="400" cy="160" r="5" fill="#1e293b"/><circle cx="400" cy="290" r="5" fill="#1e293b"/>
  <text x="415" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">X2-1</text>
  <text x="415" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">X2-2</text>
  <line x1="365" y1="280" x2="365" y2="170" stroke="#059669" stroke-width="2" marker-end="url(#arr-out)"/>
  <text x="375" y="230" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#059669">U_a</text>

  <!-- Curve Right -->
  <rect x="470" y="85" width="310" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="625" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Frequenzgang |U_a / U_e|</text>
  <line x1="510" y1="300" x2="750" y2="300" stroke="#64748b" stroke-width="2"/>
  <line x1="510" y1="300" x2="510" y2="140" stroke="#64748b" stroke-width="2"/>
  <text x="755" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">f</text>
  <text x="495" y="135" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569">|A|</text>

  <line x1="620" y1="300" x2="620" y2="185" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="620" y="318" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">f_g</text>

  <path d="M 510 160 L 590 160 Q 620 160 635 190 T 730 290" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="655" y="218" width="85" height="18" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <text x="660" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">-20 dB/Dek</text>

  <!-- Formula Footer -->
  <rect x="40" y="365" width="740" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="390" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Grenzfrequenz &amp; Phasenverschiebung:</text>
  <text x="410" y="415" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2563eb" text-anchor="middle">f_g = 1 / (2π · R₁ · C₁)   |   φ = −arctan(f / f_g)</text>
</svg>