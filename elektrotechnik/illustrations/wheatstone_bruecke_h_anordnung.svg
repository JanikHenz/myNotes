<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Wheatstonesche Messbrücke in H-Anordnung</text>

  <!-- Left: H-Bridge Circuit Diagram -->
  <g transform="translate(30, 50)">
    <!-- Supply Top (+U0) and Bottom (GND) -->
    <line x1="80" y1="20" x2="200" y2="20" stroke="#1e293b" stroke-width="2" />
    <text x="140" y="12" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">+ U₀</text>

    <line x1="80" y1="170" x2="200" y2="170" stroke="#1e293b" stroke-width="2" />
    <text x="140" y="185" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">GND</text>

    <!-- Left Leg: R1 and R2 -->
    <line x1="80" y1="20" x2="80" y2="40" stroke="#1e293b" stroke-width="2" />
    <rect x="70" y="40" width="20" height="35" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="60" y="62" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">R₁</text>

    <line x1="80" y1="75" x2="80" y2="115" stroke="#1e293b" stroke-width="2" />
    <circle cx="80" cy="95" r="3" fill="#1e293b" />
    <text x="65" y="99" font-size="10" font-weight="bold" fill="#2563eb">A</text>

    <rect x="70" y="115" width="20" height="35" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="60" y="137" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">R₂</text>
    <line x1="80" y1="150" x2="80" y2="170" stroke="#1e293b" stroke-width="2" />

    <!-- Right Leg: R3 and Rx -->
    <line x1="200" y1="20" x2="200" y2="40" stroke="#1e293b" stroke-width="2" />
    <rect x="190" y="40" width="20" height="35" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="220" y="62" font-size="11" font-weight="bold" fill="#0f172a">R₃</text>

    <line x1="200" y1="75" x2="200" y2="115" stroke="#1e293b" stroke-width="2" />
    <circle cx="200" cy="95" r="3" fill="#1e293b" />
    <text x="210" y="99" font-size="10" font-weight="bold" fill="#2563eb">B</text>

    <rect x="190" y="115" width="20" height="35" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" />
    <text x="220" y="137" font-size="11" font-weight="bold" fill="#dc2626">Rx</text>
    <line x1="200" y1="150" x2="200" y2="170" stroke="#1e293b" stroke-width="2" />

    <!-- Horizontal Crossbar with Galvanometer G -->
    <line x1="80" y1="95" x2="123" y2="95" stroke="#1e293b" stroke-width="2" />
    <circle cx="140" cy="95" r="17" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <text x="140" y="100" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">G</text>
    <line x1="157" y1="95" x2="200" y2="95" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Right: Law & Formulas -->
  <rect x="290" y="55" width="230" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="305" y="80" font-size="13" font-weight="bold" fill="#0f172a">Abgleichbedingung (U_AB = 0):</text>

  <text x="305" y="108" font-size="13" font-weight="bold" fill="#16a34a">R₁ / R₂ = R₃ / Rx</text>

  <line x1="305" y1="120" x2="505" y2="120" stroke="#e2e8f0" stroke-width="1" />

  <text x="305" y="142" font-size="12" fill="#dc2626" font-weight="bold">Unbekannter Widerstand Rx:</text>
  <text x="305" y="165" font-size="14" font-weight="bold" fill="#2563eb">Rx = R₃ · (R₂ / R₁)</text>

  <text x="305" y="195" font-size="10" fill="#64748b">Vorteil: Nullabgleich ist unabhängig</text>
  <text x="305" y="210" font-size="10" fill="#64748b">von der genauen Speisespannung U₀!</text>
</svg>