<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Kabelaufbau: Koaxialkabel &amp; Lichtwellenleiter (LWL)</text>

  <!-- Left: Coaxial Cable -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="235" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Koaxialkabel (HF / BNC)</text>
    
    <!-- Concentric stepped layers -->
    <!-- Outer jacket (PVC black) -->
    <rect x="25" y="55" width="50" height="60" rx="3" fill="#334155" />
    <text x="50" y="45" font-size="9" font-weight="bold" fill="#334155" text-anchor="middle">Außenmantel</text>
    
    <!-- Braided Shield (Geflecht) -->
    <rect x="75" y="60" width="40" height="50" fill="#94a3b8" stroke="#64748b" stroke-dasharray="2,2" />
    <text x="95" y="125" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">Schirmgeflecht</text>
    
    <!-- Dielectric (Isolator weiß) -->
    <rect x="115" y="65" width="40" height="40" fill="#e2e8f0" stroke="#cbd5e1" />
    <text x="135" y="45" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Dielektrikum</text>
    
    <!-- Inner copper core -->
    <rect x="155" y="77" width="55" height="16" fill="#f97316" stroke="#ea580c" />
    <text x="182" y="125" font-size="9" font-weight="bold" fill="#ea580c" text-anchor="middle">Innenleiter (Cu)</text>

    <text x="117" y="145" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Wellenwiderstand z. B. 50 Ω / 75 Ω</text>
    <text x="117" y="162" font-size="10" fill="#64748b" text-anchor="middle">Hervorragende Schirmung gegen EMV</text>
  </g>

  <!-- Right: Fiber Optic Cable (LWL) -->
  <g transform="translate(285, 60)">
    <rect x="0" y="0" width="235" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Lichtwellenleiter (Glasfaser)</text>
    
    <!-- LWL Layers -->
    <!-- Cladding -->
    <rect x="25" y="60" width="185" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6" />
    <text x="50" y="50" font-size="9" fill="#2563eb" text-anchor="middle">Mantel (n₂)</text>

    <!-- Core (Kern n1 > n2) -->
    <rect x="25" y="75" width="185" height="20" fill="#eff6ff" stroke="#93c5fd" />
    <text x="117" y="70" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">Kern (n₁ &gt; n₂)</text>

    <!-- Light beam zigzag (total internal reflection) -->
    <path d="M 25,85 L 60,75 L 100,95 L 140,75 L 180,95 L 210,80" fill="none" stroke="#ef4444" stroke-width="2.5" />
    <text x="150" y="108" font-size="9" font-weight="bold" fill="#ef4444">Lichtstrahl</text>

    <text x="117" y="145" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Prinzip: Totalreflexion</text>
    <text x="117" y="162" font-size="10" fill="#64748b" text-anchor="middle">Immun gegen elektromagnetische Störungen</text>
  </g>
</svg>