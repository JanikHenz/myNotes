<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 520 260"
   width="100%"
   height="100%"
   style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;"
   version="1.1"
   id="svg14"
   sodipodi:docname="elektrischer_fluss_vektor_flaeche.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview14"
     pagecolor="#ffffff"
     bordercolor="#999999"
     borderopacity="1"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.0405592"
     inkscape:cx="274.12721"
     inkscape:cy="152.60351"
     inkscape:window-width="2560"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="g7" />
  <defs
     id="defs2">
    <marker
       id="arr-blue"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto">
      <path
         d="M 0 1 L 10 5 L 0 9 z"
         fill="#2563eb"
         id="path1" />
    </marker>
    <marker
       id="arr-red"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto">
      <path
         d="M 0 1 L 10 5 L 0 9 z"
         fill="#dc2626"
         id="path2" />
    </marker>
  </defs>
  <text
     x="20"
     y="30"
     font-size="16"
     font-weight="bold"
     fill="#0f172a"
     id="text2">Elektrischer Fluss durch ein Flächenelement (Φ_E)</text>
  <!-- Left: Surface Area with Field Lines -->
  <g
     transform="translate(30, 60)"
     id="g7">
    <!-- Plane Parallelogram -->
    <polygon
       points="40,110 140,80 180,120 80,150"
       fill="#e2e8f0"
       stroke="#94a3b8"
       stroke-width="2"
       id="polygon2" />
    <text
       x="78.426857"
       y="117.10671"
       font-size="12px"
       font-weight="bold"
       fill="#0f172a"
       text-anchor="middle"
       id="text3">Fläche ΔA</text>
    <!-- Normal Vector n perpendicular to plane -->
    <line
       x1="110"
       y1="115"
       x2="110"
       y2="40"
       stroke="#dc2626"
       stroke-width="2.5"
       marker-end="url(#arr-red)"
       id="line3" />
    <text
       x="102"
       y="38"
       font-size="12"
       font-weight="bold"
       fill="#dc2626"
       text-anchor="end"
       id="text4">n (Flächennormale)</text>
    <!-- E-Field lines passing through at angle theta -->
    <line
       x1="30"
       y1="90"
       x2="150"
       y2="30"
       stroke="#2563eb"
       stroke-width="2"
       marker-end="url(#arr-blue)"
       id="line4" />
    <line
       x1="70"
       y1="140"
       x2="190"
       y2="80"
       stroke="#2563eb"
       stroke-width="2"
       marker-end="url(#arr-blue)"
       id="line5" />
    <line
       x1="50"
       y1="170"
       x2="170"
       y2="110"
       stroke="#2563eb"
       stroke-width="2"
       marker-end="url(#arr-blue)"
       id="line6" />
    <text
       x="160"
       y="25"
       font-size="12"
       font-weight="bold"
       fill="#2563eb"
       id="text6">E-Feld</text>
    <!-- Angle theta arc -->
    <path
       d="M 110,75 A 35,35 0 0,1 125,70"
       fill="none"
       stroke="#64748b"
       stroke-width="1.5"
       id="path6" />
    <text
       x="122"
       y="65"
       font-size="10"
       fill="#64748b"
       id="text7">θ</text>
  </g>
  <!-- Right: Formula Box -->
  <rect
     x="260"
     y="55"
     width="240"
     height="180"
     rx="6"
     fill="#f8fafc"
     stroke="#cbd5e1"
     stroke-width="1.5"
     id="rect7" />
  <text
     x="275"
     y="80"
     font-size="13"
     font-weight="bold"
     fill="#0f172a"
     id="text8">Definition des Flusses:</text>
  <text
     x="275"
     y="108"
     font-size="13"
     font-weight="bold"
     fill="#2563eb"
     id="text9">Φ_E = E · ΔA = E · n · ΔA</text>
  <text
     x="275"
     y="130"
     font-size="12"
     fill="#334155"
     id="text10">Φ_E = |E| · |ΔA| · cos(θ)</text>
  <line
     x1="275"
     y1="142"
     x2="485"
     y2="142"
     stroke="#e2e8f0"
     stroke-width="1"
     id="line10" />
  <text
     x="275"
     y="162"
     font-size="11"
     fill="#16a34a"
     font-weight="bold"
     id="text11">Maximaler Fluss (θ = 0°):</text>
  <text
     x="275"
     y="178"
     font-size="11"
     fill="#334155"
     id="text12">E-Feld steht senkrecht auf Fläche.</text>
  <text
     x="275"
     y="198"
     font-size="11"
     fill="#dc2626"
     font-weight="bold"
     id="text13">Fluss = 0 (θ = 90°):</text>
  <text
     x="275"
     y="214"
     font-size="11"
     fill="#64748b"
     id="text14">Feldlinien streifen nur parallel vorbei.</text>
</svg>
