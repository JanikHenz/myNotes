<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- NPN (Left) -->
  <g transform="translate(40, 20)">
    <text x="90" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">NPN-Transistor</text>
    <circle cx="90" cy="100" r="30" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <line x1="75" y1="80" x2="75" y2="120" stroke="#1e293b" stroke-width="4" />
    <!-- Collector C -->
    <line x1="105" y1="80" x2="75" y2="90" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="80" x2="105" y2="50" stroke="#1e293b" stroke-width="2" />
    <text x="115" y="55" font-size="13" font-weight="bold" fill="#0f172a">C</text>
    <!-- Base B -->
    <line x1="40" y1="100" x2="75" y2="100" stroke="#1e293b" stroke-width="2" />
    <text x="25" y="105" font-size="13" font-weight="bold" fill="#0f172a">B</text>
    <!-- Emitter E with outward arrow -->
    <line x1="75" y1="110" x2="105" y2="120" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
    <line x1="105" y1="120" x2="105" y2="150" stroke="#1e293b" stroke-width="2" />
    <text x="115" y="155" font-size="13" font-weight="bold" fill="#0f172a">E</text>
    <text x="90" y="185" font-size="12" fill="#64748b" text-anchor="middle">Pfeil zeigt nach außen</text>
  </g>
  <!-- PNP (Right) -->
  <g transform="translate(280, 20)">
    <text x="90" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">PNP-Transistor</text>
    <circle cx="90" cy="100" r="30" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <line x1="75" y1="80" x2="75" y2="120" stroke="#1e293b" stroke-width="4" />
    <!-- Collector C -->
    <line x1="105" y1="120" x2="75" y2="110" stroke="#1e293b" stroke-width="2" />
    <line x1="105" y1="120" x2="105" y2="150" stroke="#1e293b" stroke-width="2" />
    <text x="115" y="155" font-size="13" font-weight="bold" fill="#0f172a">C</text>
    <!-- Base B -->
    <line x1="40" y1="100" x2="75" y2="100" stroke="#1e293b" stroke-width="2" />
    <text x="25" y="105" font-size="13" font-weight="bold" fill="#0f172a">B</text>
    <!-- Emitter E with inward arrow -->
    <line x1="105" y1="80" x2="77" y2="90" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
    <line x1="105" y1="80" x2="105" y2="50" stroke="#1e293b" stroke-width="2" />
    <text x="115" y="55" font-size="13" font-weight="bold" fill="#0f172a">E</text>
    <text x="90" y="185" font-size="12" fill="#64748b" text-anchor="middle">Pfeil zeigt nach innen</text>
  </g>
</svg>