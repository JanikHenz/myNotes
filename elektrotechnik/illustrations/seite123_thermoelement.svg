<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Prinzip des Thermoelements (Seebeck-Effekt)</text>
  <!-- Wire 1: Eisen (Iron) - Top -->
  <path d="M 120,120 L 160,80 L 340,80 L 380,120" fill="none" stroke="#475569" stroke-width="3" />
  <text x="250" y="70" font-size="14" font-weight="bold" fill="#475569" text-anchor="middle">Metall A: Eisen</text>
  <!-- Wire 2: Konstantan - Bottom -->
  <path d="M 120,120 L 160,160 L 220,160" fill="none" stroke="#d97706" stroke-width="3" />
  <path d="M 280,160 L 340,160 L 380,120" fill="none" stroke="#d97706" stroke-width="3" />
  <text x="250" y="195" font-size="14" font-weight="bold" fill="#d97706" text-anchor="middle">Metall B: Konstantan</text>
  <!-- Measuring Junction (T1) -->
  <circle cx="380" cy="120" r="6" fill="#dc2626" />
  <text x="400" y="115" font-size="14" font-weight="bold" fill="#dc2626">Messstelle T₁</text>
  <text x="400" y="135" font-size="12" fill="#dc2626">z.B. 1200 °C</text>
  <!-- Reference Junction (T2) -->
  <circle cx="120" cy="120" r="6" fill="#2563eb" />
  <text x="20" y="115" font-size="14" font-weight="bold" fill="#2563eb">Vergleichsstelle T₂</text>
  <text x="45" y="135" font-size="12" fill="#2563eb">0 °C (Eiswasser)</text>
  <!-- Millivoltmeter / Measurement Amplifier -->
  <line x1="220" y1="160" x2="220" y2="140" stroke="#1e293b" stroke-width="2" />
  <line x1="280" y1="160" x2="280" y2="140" stroke="#1e293b" stroke-width="2" />
  <rect x="210" y="110" width="80" height="35" rx="5" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="250" y="132" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">U_t (mV)</text>
  <!-- Bottom info -->
  <rect x="100" y="225" width="300" height="35" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="250" y="247" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Thermospannung: U_t = 70 mV bei ΔT = 1200 K</text>
</svg>