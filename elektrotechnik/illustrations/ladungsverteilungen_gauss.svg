<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Kontinuierliche Ladungsverteilungen (λ, σ, ρ)</text>

  <!-- 1. Linienladung (1D) -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="155" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="77" y="25" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">1D: Linienladung</text>
    <!-- Wire line -->
    <path d="M 25,100 Q 75,60 130,90" fill="none" stroke="#94a3b8" stroke-width="3" />
    <!-- Segment ΔL -->
    <path d="M 60,82 Q 75,75 90,80" fill="none" stroke="#dc2626" stroke-width="5" />
    <text x="75" y="65" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">ΔL</text>
    <!-- Formula -->
    <text x="77" y="135" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">λ = dQ / dL</text>
    <text x="77" y="155" font-size="11" fill="#64748b" text-anchor="middle">Einheit: [ C / m ]</text>
    <text x="77" y="175" font-size="10" fill="#334155" text-anchor="middle">z. B. Draht, Freileitung</text>
  </g>

  <!-- 2. Flächenladung (2D) -->
  <g transform="translate(202, 60)">
    <rect x="0" y="0" width="155" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="77" y="25" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">2D: Flächenladung</text>
    <!-- Parallelogram plane -->
    <polygon points="30,105 105,75 135,105 60,135" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Segment ΔA -->
    <polygon points="70,95 95,85 105,95 80,105" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5" />
    <text x="90" y="120" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">ΔA</text>
    <!-- Formula -->
    <text x="77" y="150" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">σ = dQ / dA</text>
    <text x="77" y="168" font-size="11" fill="#64748b" text-anchor="middle">Einheit: [ C / m² ]</text>
    <text x="77" y="183" font-size="10" fill="#334155" text-anchor="middle">z. B. Kondensatorplatte</text>
  </g>

  <!-- 3. Raumladung (3D) -->
  <g transform="translate(375, 60)">
    <rect x="0" y="0" width="155" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="77" y="25" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">3D: Raumladung</text>
    <!-- 3D Box / Volume -->
    <polygon points="35,100 75,75 125,75 85,100" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="35,100 85,100 85,130 35,130" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="85,100 125,75 125,105 85,130" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
    <!-- Volume Element ΔV -->
    <rect x="50" y="105" width="20" height="20" fill="#ef4444" opacity="0.8" />
    <text x="60" y="95" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">ΔV</text>
    <!-- Formula -->
    <text x="77" y="150" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">ρ = dQ / dV</text>
    <text x="77" y="168" font-size="11" fill="#64748b" text-anchor="middle">Einheit: [ C / m³ ]</text>
    <text x="77" y="183" font-size="10" fill="#334155" text-anchor="middle">z. B. Wolke, Halbleiter</text>
  </g>
</svg>