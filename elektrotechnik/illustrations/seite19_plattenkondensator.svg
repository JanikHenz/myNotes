<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-start-dark" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Homogenes elektrisches Feld im Plattenkondensator</text>
  <!-- Left Plate (+Q) -->
  <rect x="80" y="60" width="16" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="3" />
  <text x="88" y="85" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="88" y="115" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="88" y="145" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="88" y="175" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="88" y="200" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <text x="88" y="230" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">+Q, +σ</text>
  <!-- Right Plate (-Q) -->
  <rect x="360" y="60" width="16" height="150" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="3" />
  <text x="368" y="85" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="368" y="115" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="368" y="145" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="368" y="175" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="368" y="200" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">−</text>
  <text x="368" y="230" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">−Q, −σ</text>
  <!-- Field Lines (E-Vector) -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
    <line x1="100" y1="80" x2="350" y2="80" />
    <line x1="100" y1="110" x2="350" y2="110" />
    <line x1="100" y1="140" x2="350" y2="140" />
    <line x1="100" y1="170" x2="350" y2="170" />
    <line x1="100" y1="195" x2="350" y2="195" />
  </g>
  <text x="225" y="130" font-size="15" font-weight="bold" fill="#2563eb">E-Feld</text>
  <!-- Distance d dimension line -->
  <line x1="96" y1="245" x2="360" y2="245" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow-start-dark)" marker-end="url(#arrow-dark)" />
  <text x="228" y="242" font-size="13" fill="#64748b" text-anchor="middle">Abstand d</text>
</svg>