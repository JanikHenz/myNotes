<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Leuchtdioden (LED): Durchlassspannungen &amp; Polarität</text>

  <!-- Left: Color Threshold Table -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="250" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="125" y="22" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Schwellenspannung U_F je Farbe:</text>

    <!-- Color bars -->
    <g transform="translate(15, 35)">
      <!-- IR -->
      <circle cx="10" cy="8" r="6" fill="#475569" /><text x="25" y="12" font-size="10" fill="#334155">Infrarot (IR):</text><text x="160" y="12" font-size="10" font-weight="bold" fill="#0f172a">1,2 – 1,5 V</text>
      <!-- Red -->
      <circle cx="10" cy="32" r="6" fill="#dc2626" /><text x="25" y="36" font-size="10" fill="#334155">Rot:</text><text x="160" y="36" font-size="10" font-weight="bold" fill="#dc2626">1,6 – 2,0 V</text>
      <!-- Yellow / Orange -->
      <circle cx="10" cy="56" r="6" fill="#eab308" /><text x="25" y="60" font-size="10" fill="#334155">Gelb / Orange:</text><text x="160" y="60" font-size="10" font-weight="bold" fill="#ca8a04">2,0 – 2,2 V</text>
      <!-- Green -->
      <circle cx="10" cy="80" r="6" fill="#16a34a" /><text x="25" y="84" font-size="10" fill="#334155">Grün:</text><text x="160" y="84" font-size="10" font-weight="bold" fill="#16a34a">2,1 – 3,0 V</text>
      <!-- Blue / White -->
      <circle cx="10" cy="104" r="6" fill="#2563eb" /><text x="25" y="108" font-size="10" fill="#334155">Blau / Weiß:</text><text x="160" y="108" font-size="10" font-weight="bold" fill="#2563eb">3,0 – 3,6 V</text>
    </g>

    <text x="125" y="165" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">Regel: Je kurzwelliger, desto höher U_F</text>
  </g>

  <!-- Right: Pinout & Resistor Calculation -->
  <g transform="translate(300, 55)">
    <rect x="0" y="0" width="215" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="107" y="22" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Polarität &amp; Vorwiderstand:</text>

    <!-- LED Symbol -->
    <g transform="translate(60, 45)">
      <line x1="0" y1="20" x2="35" y2="20" stroke="#1e293b" stroke-width="2" />
      <polygon points="35,10 35,30 55,20" fill="#dc2626" />
      <line x1="55" y1="10" x2="55" y2="30" stroke="#1e293b" stroke-width="2" />
      <line x1="55" y1="20" x2="90" y2="20" stroke="#1e293b" stroke-width="2" />
      <text x="5" y="12" font-size="9" font-weight="bold" fill="#dc2626">Anode (+)</text>
      <text x="50" y="12" font-size="9" font-weight="bold" fill="#2563eb">Kathode (−)</text>
      <!-- Housing Flat -->
      <text x="45" y="42" font-size="9" fill="#64748b">(abgeflachte Kante)</text>
    </g>

    <!-- Formula -->
    <rect x="15" y="115" width="185" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="107" y="135" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">Vorwiderstand R_V:</text>
    <text x="107" y="155" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">R_V = (U_ges − U_F) / I_F</text>
  </g>
</svg>