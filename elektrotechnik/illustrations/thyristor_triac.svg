<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 255" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Left: Thyristor (SCR) -->
  <g transform="translate(40, 15)">
    <text x="90" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Thyristor (SCR)</text>
    <!-- Anode line -->
    <line x1="90" y1="52" x2="90" y2="82" stroke="#1e293b" stroke-width="2" />
    <text x="90" y="47" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Anode (A)</text>
    <!-- Diode triangle -->
    <polygon points="65,82 115,82 90,117" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <line x1="65" y1="117" x2="115" y2="117" stroke="#1e293b" stroke-width="3" />
    <!-- Cathode line -->
    <line x1="90" y1="117" x2="90" y2="162" stroke="#1e293b" stroke-width="2" />
    <text x="90" y="180" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">Kathode (K)</text>
    <!-- Gate (G) -->
    <line x1="105" y1="117" x2="135" y2="137" stroke="#16a34a" stroke-width="2.5" />
    <circle cx="135" cy="137" r="3" fill="#16a34a" />
    <text x="145" y="142" font-size="12" font-weight="bold" fill="#16a34a">Gate (G)</text>
    <text x="90" y="205" font-size="11" fill="#64748b" text-anchor="middle">Einweg-Thyristor</text>
  </g>
  <!-- Right: Triac -->
  <g transform="translate(260, 15)">
    <text x="90" y="20" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Triac</text>
    <!-- Terminal 2 -->
    <line x1="90" y1="52" x2="90" y2="82" stroke="#1e293b" stroke-width="2" />
    <text x="90" y="47" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">A2 / MT2</text>
    <!-- Antiparallel Diode Triangles -->
    <polygon points="70,82 100,82 85,117" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <polygon points="95,117 125,117 110,82" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <line x1="70" y1="117" x2="100" y2="117" stroke="#1e293b" stroke-width="2.5" />
    <line x1="95" y1="82" x2="125" y2="82" stroke="#1e293b" stroke-width="2.5" />
    <!-- Terminal 1 -->
    <line x1="90" y1="117" x2="90" y2="162" stroke="#1e293b" stroke-width="2" />
    <text x="90" y="180" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">A1 / MT1</text>
    <!-- Gate -->
    <line x1="110" y1="117" x2="140" y2="137" stroke="#16a34a" stroke-width="2.5" />
    <circle cx="140" cy="137" r="3" fill="#16a34a" />
    <text x="150" y="142" font-size="12" font-weight="bold" fill="#16a34a">Gate (G)</text>
    <text x="90" y="205" font-size="11" fill="#64748b" text-anchor="middle">Zweiweg-Thyristor (AC)</text>
  </g>
</svg>