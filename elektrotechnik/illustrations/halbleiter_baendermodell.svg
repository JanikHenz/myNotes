<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Bändermodell: Isolator, Halbleiter &amp; Leiter im Vergleich</text>

  <!-- Energy Axis on Left -->
  <g transform="translate(30, 50)">
    <line x1="20" y1="170" x2="20" y2="10" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-dark)" />
    <text x="10" y="15" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="end">Energie E</text>
  </g>

  <!-- 1. Isolator -->
  <g transform="translate(70, 50)">
    <rect x="0" y="0" width="135" height="190" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="67" y="22" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Isolator</text>

    <!-- Conduction Band -->
    <rect x="15" y="40" width="105" height="25" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="67" y="56" font-size="9" fill="#64748b" text-anchor="middle">Leitungsband (leer)</text>

    <!-- Large Bandgap -->
    <rect x="15" y="65" width="105" height="45" fill="#fee2e2" opacity="0.5" />
    <text x="67" y="90" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">E_g &gt; 3–5 eV</text>
    <text x="67" y="103" font-size="8" fill="#7f1d1d" text-anchor="middle">Große Bandlücke</text>

    <!-- Valence Band -->
    <rect x="15" y="110" width="105" height="25" fill="#bfdbfe" stroke="#3b82f6" />
    <text x="67" y="126" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">Valenzband (voll)</text>

    <text x="67" y="160" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">Leitet NICHT</text>
    <text x="67" y="174" font-size="8" fill="#64748b" text-anchor="middle">(z. B. Diamant, Keramik)</text>
  </g>

  <!-- 2. Halbleiter -->
  <g transform="translate(220, 50)">
    <rect x="0" y="0" width="135" height="190" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="67" y="22" font-size="11" font-weight="bold" fill="#ca8a04" text-anchor="middle">Halbleiter (Si/Ge)</text>

    <!-- Conduction Band -->
    <rect x="15" y="40" width="105" height="25" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="67" y="56" font-size="9" fill="#64748b" text-anchor="middle">Leitungsband</text>

    <!-- Moderate Bandgap -->
    <rect x="15" y="65" width="105" height="25" fill="#fef3c7" opacity="0.6" />
    <text x="67" y="81" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">E_g ≈ 1,1 eV</text>

    <!-- Valence Band -->
    <rect x="15" y="90" width="105" height="25" fill="#bfdbfe" stroke="#3b82f6" />
    <text x="67" y="106" font-size="9" font-weight="bold" fill="#1e40af" text-anchor="middle">Valenzband</text>

    <text x="67" y="150" font-size="10" font-weight="bold" fill="#ca8a04" text-anchor="middle">Thermisches Anregen</text>
    <text x="67" y="166" font-size="9" fill="#334155" text-anchor="middle">Elektronen springen</text>
    <text x="67" y="178" font-size="8" fill="#64748b" text-anchor="middle">ins Leitungsband</text>
  </g>

  <!-- 3. Leiter -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="135" height="190" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="67" y="22" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Leiter (Metall)</text>

    <!-- Overlapping Bands -->
    <rect x="15" y="50" width="105" height="50" fill="#dcfce7" stroke="#16a34a" />
    <line x1="15" y1="75" x2="120" y2="75" stroke="#16a34a" stroke-dasharray="2,2" />
    <text x="67" y="68" font-size="9" fill="#16a34a" text-anchor="middle">Bänder überlappen</text>
    <text x="67" y="90" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">E_g = 0 eV</text>

    <text x="67" y="150" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Leitet IMMER</text>
    <text x="67" y="166" font-size="9" fill="#334155" text-anchor="middle">Freie Elektronen</text>
    <text x="67" y="178" font-size="8" fill="#64748b" text-anchor="middle">(z. B. Kupfer, Alu, Gold)</text>
  </g>
</svg>