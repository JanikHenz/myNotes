<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-start-dark" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Langgestreckte Zylinderspule (Solenoid)</text>
  <!-- Solenoid Body -->
  <rect x="80" y="70" width="300" height="90" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="6" />
  <!-- Homogeneous B field inside -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
    <line x1="100" y1="95" x2="360" y2="95" />
    <line x1="100" y1="115" x2="360" y2="115" />
    <line x1="100" y1="135" x2="360" y2="135" />
  </g>
  <rect x="155" y="106" width="150" height="20" rx="3" fill="#ffffff" fill-opacity="0.95" />
  <text x="230" y="121" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">homogenes B-Feld</text>
  <!-- Windings around cylinder -->
  <g stroke="#ea580c" stroke-width="3" fill="none">
    <path d="M 120,60 L 140,170" />
    <path d="M 160,60 L 180,170" />
    <path d="M 200,60 L 220,170" />
    <path d="M 240,60 L 260,170" />
    <path d="M 280,60 L 300,170" />
    <path d="M 320,60 L 340,170" />
  </g>
  <text x="230" y="55" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">N Windungen</text>
  <!-- Length l dimension line -->
  <line x1="80" y1="185" x2="380" y2="185" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow-start-dark)" marker-end="url(#arrow-dark)" />
  <text x="230" y="200" font-size="12" fill="#64748b" text-anchor="middle">Spulenlänge l</text>
  <!-- Formula -->
  <rect x="110" y="215" width="240" height="25" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="230" y="232" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">B = μ₀ · μ_r · (N / l) · I</text>
</svg>