<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Lorentzkraft im Magnetjoch (Leiterschaukel-Versuch)</text>

  <!-- Left: 3D-like Horseshoe / C-Yoke Magnet with Conductor -->
  <g transform="translate(40, 55)">
    <!-- Top Pole: North (Red) -->
    <polygon points="30,30 110,30 140,55 60,55" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="85" y="47" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>

    <!-- Bottom Pole: South (Blue) -->
    <polygon points="30,135 110,135 140,160 60,160" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="85" y="152" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>

    <!-- Magnet back connecting yoke -->
    <polygon points="30,30 60,55 60,160 30,135" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />

    <!-- Magnetic Field Lines (downward from N to S) -->
    <line x1="85" y1="58" x2="85" y2="132" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-green)" />
    <line x1="110" y1="58" x2="110" y2="132" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arr-green)" />
    <text x="125" y="95" font-size="11" font-weight="bold" fill="#16a34a">B</text>

    <!-- Conductor Rod passing horizontally through gap -->
    <line x1="30" y1="95" x2="190" y2="95" stroke="#ea580c" stroke-width="4" />
    <circle cx="190" cy="95" r="3" fill="#ea580c" />
    <text x="175" y="85" font-size="11" font-weight="bold" fill="#ea580c">Leiter (I)</text>
    <!-- Current Arrow on Rod (pointing in +y direction / right) -->
    <line x1="130" y1="95" x2="165" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />

    <!-- Resulting Deflection Force F (forward / outward) -->
    <line x1="100" y1="95" x2="60" y2="120" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-red)" />
    <text x="45" y="115" font-size="12" font-weight="bold" fill="#dc2626">F_L</text>
  </g>

  <!-- Right: 3-Finger Rule Info Card -->
  <rect x="290" y="55" width="230" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="305" y="80" font-size="13" font-weight="bold" fill="#0f172a">Drei-Finger-Regel (UVW):</text>

  <text x="305" y="105" font-size="11" fill="#2563eb" font-weight="bold">Daumen (Ursache):</text>
  <text x="305" y="120" font-size="11" fill="#334155">Stromrichtung I (technisch + nach −)</text>

  <text x="305" y="142" font-size="11" fill="#16a34a" font-weight="bold">Zeigefinger (Vermittlung):</text>
  <text x="305" y="157" font-size="11" fill="#334155">Magnetfeld B (vom Nord- zum Südpol)</text>

  <text x="305" y="179" font-size="11" fill="#dc2626" font-weight="bold">Mittelfinger (Wirkung):</text>
  <text x="305" y="194" font-size="11" fill="#dc2626" font-weight="bold">Kraft F (Ablenkung des Leiters)</text>

  <line x1="305" y1="205" x2="505" y2="205" stroke="#e2e8f0" stroke-width="1" />
  <text x="305" y="225" font-size="11" font-weight="bold" fill="#0f172a">F = I · (L × B) = I · L · B</text>
</svg>