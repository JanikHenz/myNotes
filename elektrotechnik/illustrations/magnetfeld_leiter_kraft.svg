<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Left: Conductor with concentric B-field -->
  <g transform="translate(40, 20)">
    <text x="90" y="20" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Magnetfeld eines Leiters</text>
    <!-- Wire cross-section with current out of page -->
    <circle cx="90" cy="110" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <circle cx="90" cy="110" r="4" fill="#dc2626" />
    <text x="90" y="85" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Strom I (odot)</text>
    <!-- Concentric B-field circles -->
    <circle cx="90" cy="110" r="40" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="90" cy="110" r="65" fill="none" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 90,45 L 85,45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
    <text x="160" y="115" font-size="13" font-weight="bold" fill="#2563eb">B-Feld</text>
    <text x="90" y="200" font-size="12" fill="#0f172a" text-anchor="middle">B = μ₀ I / (2π · r)</text>
  </g>
  <!-- Right: Force between 2 parallel conductors -->
  <g transform="translate(280, 20)">
    <text x="100" y="20" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Kraft zwischen Leitern</text>
    <!-- Conductor 1 -->
    <line x1="50" y1="50" x2="50" y2="160" stroke="#16a34a" stroke-width="4" />
    <line x1="50" y1="90" x2="50" y2="70" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="40" y="45" font-size="13" font-weight="bold" fill="#16a34a">I₁</text>
    <!-- Conductor 2 -->
    <line x1="150" y1="50" x2="150" y2="160" stroke="#16a34a" stroke-width="4" />
    <line x1="150" y1="90" x2="150" y2="70" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="160" y="45" font-size="13" font-weight="bold" fill="#16a34a">I₂</text>
    <!-- Attractive Forces (Same direction) -->
    <line x1="50" y1="105" x2="85" y2="105" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <line x1="150" y1="105" x2="115" y2="105" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <text x="100" y="98" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Anziehung</text>
    <text x="100" y="195" font-size="12" fill="#64748b" text-anchor="middle">Gleichgerichtet: Anziehung</text>
    <text x="100" y="210" font-size="12" fill="#64748b" text-anchor="middle">Gegengerichtet: Abstoßung</text>
  </g>
</svg>