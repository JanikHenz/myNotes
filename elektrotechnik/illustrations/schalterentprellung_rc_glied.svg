<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Schalterentprellung mit passivem RC-Tiefpass</text>

  <!-- Left: Circuit Diagram -->
  <g transform="translate(30, 50)">
    <!-- +5V Rail -->
    <line x1="30" y1="20" x2="30" y2="40" stroke="#1e293b" stroke-width="2" />
    <text x="30" y="14" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">+5V</text>

    <!-- Mechanical Pushbutton Switch -->
    <circle cx="30" cy="45" r="3" fill="#1e293b" />
    <line x1="30" y1="45" x2="50" y2="30" stroke="#1e293b" stroke-width="2" />
    <circle cx="55" cy="45" r="3" fill="#1e293b" />
    <line x1="55" y1="45" x2="80" y2="45" stroke="#1e293b" stroke-width="2" />
    <text x="40" y="22" font-size="9" fill="#64748b">Taster</text>

    <!-- Series Resistor R -->
    <rect x="80" y="37" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="97" y="49" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
    <line x1="115" y1="45" x2="160" y2="45" stroke="#1e293b" stroke-width="2" />
    
    <!-- Output Terminal -->
    <circle cx="160" cy="45" r="3" fill="#2563eb" />
    <text x="170" y="49" font-size="11" font-weight="bold" fill="#2563eb">u_C (µC)</text>

    <!-- Capacitor C to GND -->
    <line x1="140" y1="45" x2="140" y2="75" stroke="#1e293b" stroke-width="2" />
    <line x1="130" y1="75" x2="150" y2="75" stroke="#1e293b" stroke-width="2.5" />
    <line x1="130" y1="83" x2="150" y2="83" stroke="#1e293b" stroke-width="2.5" />
    <text x="160" y="82" font-size="10" font-weight="bold" fill="#0f172a">C</text>
    <line x1="140" y1="83" x2="140" y2="105" stroke="#1e293b" stroke-width="2" />
    <!-- GND -->
    <line x1="130" y1="105" x2="150" y2="105" stroke="#1e293b" stroke-width="2" />
    <line x1="135" y1="109" x2="145" y2="109" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Right: Signal Comparison (Bouncing vs. Clean RC) -->
  <g transform="translate(260, 55)">
    <rect x="0" y="0" width="260" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="130" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Signalverlauf im Zeitbereich:</text>

    <!-- Unfiltered bouncing signal (red) -->
    <text x="15" y="48" font-size="10" font-weight="bold" fill="#dc2626">Ohne RC (Prellen ca. 5–20 ms):</text>
    <path d="M 15,75 L 35,75 L 35,55 L 45,75 L 50,55 L 55,75 L 60,55 L 65,75 L 70,55 L 120,55" fill="none" stroke="#dc2626" stroke-width="2" />
    <text x="130" y="65" font-size="9" fill="#dc2626">Fehlimpulse!</text>

    <line x1="15" y1="85" x2="245" y2="85" stroke="#e2e8f0" stroke-width="1" />

    <!-- Filtered smooth RC signal (green) -->
    <text x="15" y="105" font-size="10" font-weight="bold" fill="#16a34a">Mit RC-Filter (saubere Ladekurve):</text>
    <path d="M 15,145 L 35,145 Q 60,115 110,115 L 200,115" fill="none" stroke="#16a34a" stroke-width="2.5" />
    <text x="130" y="135" font-size="9" fill="#16a34a">Glatter Flankenanstieg</text>

    <text x="130" y="170" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Dimensionierung: τ = R · C ≈ 10–50 ms</text>
  </g>
</svg>