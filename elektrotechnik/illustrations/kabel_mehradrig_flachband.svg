<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Kabelbauformen: Mehradriges Netzkabel &amp; Flachbandkabel</text>

  <!-- Left: Multi-core mains cable -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="230" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Mehradriges Netzkabel</text>

    <!-- Outer grey jacket -->
    <rect x="25" y="45" width="60" height="65" rx="4" fill="#94a3b8" />
    <text x="55" y="40" font-size="9" fill="#475569" text-anchor="middle">Mantel</text>

    <!-- 3 cores emerging: L (Brown), N (Blue), PE (Green-Yellow) -->
    <!-- L -->
    <rect x="85" y="48" width="40" height="14" rx="2" fill="#92400e" />
    <rect x="125" y="52" width="25" height="6" fill="#ea580c" />
    <text x="155" y="58" font-size="9" font-weight="bold" fill="#92400e">L (Braun)</text>

    <!-- PE -->
    <rect x="85" y="70" width="40" height="14" rx="2" fill="#16a34a" />
    <line x1="85" y1="77" x2="125" y2="77" stroke="#eab308" stroke-width="3" />
    <rect x="125" y="74" width="25" height="6" fill="#ea580c" />
    <text x="155" y="80" font-size="9" font-weight="bold" fill="#16a34a">PE (Grün-Gelb)</text>

    <!-- N -->
    <rect x="85" y="92" width="40" height="14" rx="2" fill="#2563eb" />
    <rect x="125" y="96" width="25" height="6" fill="#ea580c" />
    <text x="155" y="102" font-size="9" font-weight="bold" fill="#2563eb">N (Blau)</text>

    <text x="115" y="145" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Schichtenaufbau:</text>
    <text x="115" y="162" font-size="10" fill="#64748b" text-anchor="middle">Mantel → Isolation → Litzenleiter</text>
  </g>

  <!-- Right: Ribbon cable (Flachbandkabel) -->
  <g transform="translate(280, 55)">
    <rect x="0" y="0" width="230" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Flachbandkabel (Ribbon)</text>

    <!-- Parallel flat strands -->
    <g transform="translate(30, 45)">
      <!-- Red edge marker (Pin 1) -->
      <rect x="0" y="0" width="160" height="10" fill="#ef4444" stroke="#dc2626" />
      <text x="170" y="8" font-size="9" font-weight="bold" fill="#ef4444">Pin 1 (Rot)</text>

      <!-- Grey parallel strands -->
      <rect x="0" y="12" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
      <rect x="0" y="23" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
      <rect x="0" y="34" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
      <rect x="0" y="45" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
      <rect x="0" y="56" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
      <rect x="0" y="67" width="160" height="9" fill="#cbd5e1" stroke="#94a3b8" />
    </g>

    <text x="115" y="145" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Einsatz in Computern &amp; Bussystemen</text>
    <text x="115" y="162" font-size="10" fill="#64748b" text-anchor="middle">Schnelle IDC-Schneidklemmtechnik</text>
  </g>
</svg>