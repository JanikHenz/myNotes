<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="bold" fill="#0f172a">Ausgangskennlinienfeld eines N-Kanal MOSFETs</text>
  <!-- Axes -->
  <line x1="70" y1="225" x2="480" y2="225" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <line x1="70" y1="225" x2="70" y2="55" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <text x="485" y="230" font-size="12" font-weight="bold" fill="#1e293b">U_DS (V)</text>
  <text x="60" y="48" font-size="12" font-weight="bold" fill="#1e293b">I_D (mA)</text>

  <!-- Pinch-off boundary (dashed parabola) -->
  <path d="M 70,225 Q 150,175 190,85" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="95" y="75" font-size="11" fill="#64748b">Ohmscher Bereich</text>
  <text x="270" y="65" font-size="11" fill="#64748b">Sättigungsbereich (Aktiv)</text>

  <!-- Curves for U_GS -->
  <!-- Curve 1 (High U_GS) -->
  <path d="M 70,225 Q 120,105 190,90 L 450,85" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <text x="458" y="90" font-size="11" font-weight="bold" fill="#2563eb">U_GS = 5V</text>

  <!-- Curve 2 -->
  <path d="M 70,225 Q 115,140 165,130 L 450,125" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <text x="458" y="130" font-size="11" font-weight="bold" fill="#2563eb">U_GS = 4V</text>

  <!-- Curve 3 -->
  <path d="M 70,225 Q 110,175 145,170 L 450,165" fill="none" stroke="#2563eb" stroke-width="2.5" />
  <text x="458" y="170" font-size="11" font-weight="bold" fill="#2563eb">U_GS = 3V</text>

  <!-- Curve 4 (Threshold U_th) -->
  <line x1="70" y1="225" x2="450" y2="225" stroke="#dc2626" stroke-width="2" />
  <text x="250" y="245" font-size="11" font-weight="bold" fill="#dc2626">U_GS &lt; U_th (Sperrbereich)</text>
</svg>