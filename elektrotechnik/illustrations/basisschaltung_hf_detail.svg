<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Diskrete HF-Basisschaltung (Grounded-Base Amplifier)</text>

  <!-- Left: Circuit Diagram -->
  <g transform="translate(25, 50)">
    <!-- +VCC Rail Top -->
    <line x1="40" y1="15" x2="180" y2="15" stroke="#dc2626" stroke-width="2" />
    <text x="185" y="19" font-size="11" font-weight="bold" fill="#dc2626">+V_CC</text>

    <!-- Transistor in center -->
    <circle cx="120" cy="95" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <line x1="120" y1="85" x2="120" y2="105" stroke="#1e293b" stroke-width="2.5" />
    <!-- Collector up -->
    <line x1="120" y1="88" x2="135" y2="80" stroke="#1e293b" stroke-width="1.5" />
    <line x1="135" y1="80" x2="135" y2="50" stroke="#1e293b" stroke-width="1.8" />
    <!-- Collector Resistor RC -->
    <rect x="127" y="25" width="16" height="25" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="148" y="40" font-size="9" font-weight="bold" fill="#0f172a">R_C</text>
    <line x1="135" y1="25" x2="135" y2="15" stroke="#1e293b" stroke-width="1.8" />

    <!-- Output decoupling CC -->
    <line x1="135" y1="65" x2="175" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <line x1="175" y1="58" x2="175" y2="72" stroke="#1e293b" stroke-width="2" />
    <line x1="181" y1="58" x2="181" y2="72" stroke="#1e293b" stroke-width="2" />
    <line x1="181" y1="65" x2="205" y2="65" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="205" cy="65" r="2.5" fill="#dc2626" />
    <text x="212" y="69" font-size="10" font-weight="bold" fill="#dc2626">U_out</text>

    <!-- Emitter down (Input!) -->
    <line x1="120" y1="102" x2="135" y2="110" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="127,105 133,109 130,103" fill="#1e293b" />
    <line x1="135" y1="110" x2="135" y2="135" stroke="#1e293b" stroke-width="1.8" />
    <rect x="127" y="135" width="16" height="25" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="148" y="150" font-size="9" font-weight="bold" fill="#0f172a">R_E</text>
    <line x1="135" y1="160" x2="135" y2="180" stroke="#1e293b" stroke-width="1.8" />

    <!-- Input decoupling CE into Emitter -->
    <line x1="135" y1="125" x2="80" y2="125" stroke="#1e293b" stroke-width="1.8" />
    <line x1="80" y1="118" x2="80" y2="132" stroke="#1e293b" stroke-width="2" />
    <line x1="74" y1="118" x2="74" y2="132" stroke="#1e293b" stroke-width="2" />
    <line x1="74" y1="125" x2="45" y2="125" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="45" cy="125" r="2.5" fill="#2563eb" />
    <text x="38" y="129" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="end">U_in</text>

    <!-- Base grounded for HF with capacitor CB -->
    <line x1="102" y1="95" x2="75" y2="95" stroke="#1e293b" stroke-width="1.8" />
    <text x="82" y="90" font-size="9" fill="#0f172a">B</text>
    <line x1="75" y1="95" x2="75" y2="105" stroke="#1e293b" stroke-width="1.8" />
    <line x1="68" y1="105" x2="82" y2="105" stroke="#1e293b" stroke-width="2" />
    <line x1="68" y1="111" x2="82" y2="111" stroke="#1e293b" stroke-width="2" />
    <text x="90" y="112" font-size="8" fill="#16a34a">C_B</text>
    <line x1="75" y1="111" x2="75" y2="120" stroke="#1e293b" stroke-width="1.8" />
  </g>

  <!-- Right: Characteristics -->
  <rect x="290" y="50" width="260" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="305" y="75" font-size="12" font-weight="bold" fill="#0f172a">HF-Eigenschaften:</text>

  <text x="305" y="100" font-size="11" fill="#16a34a" font-weight="bold">• Kein Miller-Effekt:</text>
  <text x="305" y="118" font-size="10" fill="#334155">Basis schirmt Kollektor vom</text>
  <text x="305" y="134" font-size="10" fill="#334155">Emitter ab (extrem hohe Grenzfrequenz).</text>

  <line x1="305" y1="145" x2="535" y2="145" stroke="#e2e8f0" stroke-width="1" />

  <text x="305" y="162" font-size="10" font-weight="bold" fill="#0f172a">Stromverstärkung:</text>
  <text x="305" y="176" font-size="11" font-weight="bold" fill="#2563eb">v_i = I_C / I_E ≈ 1  (keine Stromverst.)</text>

  <text x="305" y="196" font-size="10" font-weight="bold" fill="#0f172a">Spannungsverstärkung:</text>
  <text x="305" y="210" font-size="11" font-weight="bold" fill="#16a34a">v_u ≈ R_C / r_e  (sehr hoch, 0° Phase)</text>
</svg>