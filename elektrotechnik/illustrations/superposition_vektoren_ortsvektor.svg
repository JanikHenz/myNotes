<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Superpositionsprinzip: Ortsvektoren &amp; E-Feld</text>

  <!-- Left: Coordinate System -->
  <g transform="translate(40, 60)">
    <!-- Axes -->
    <line x1="20" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <line x1="20" y1="160" x2="20" y2="20" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <text x="245" y="165" font-size="12" fill="#1e293b">x</text>
    <text x="15" y="15" font-size="12" fill="#1e293b">y</text>
    <text x="8" y="175" font-size="11" fill="#64748b">0</text>

    <!-- Source Charge q at r_q -->
    <circle cx="70" cy="110" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="70" y="114" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">+q</text>
    <!-- r_q Vector -->
    <line x1="20" y1="160" x2="63" y2="116" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-dark)" />
    <text x="35" y="132" font-size="10" fill="#64748b">r_q</text>

    <!-- Target Point P at r_P -->
    <circle cx="180" cy="50" r="4" fill="#2563eb" />
    <text x="190" y="50" font-size="11" font-weight="bold" fill="#2563eb">P</text>
    <!-- r_P Vector -->
    <line x1="20" y1="160" x2="175" y2="54" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-dark)" />
    <text x="95" y="120" font-size="10" fill="#64748b">r_P</text>

    <!-- Distance Vector r = r_P - r_q -->
    <line x1="77" y1="104" x2="174" y2="54" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)" />
    <rect x="108" y="63" width="85" height="16" rx="3" fill="#ffffff" fill-opacity="0.95"/>
    <text x="112" y="75" font-size="11" font-weight="bold" fill="#2563eb">r = r_P − r_q</text>

    <!-- E-Field Vector at P -->
    <line x1="180" y1="50" x2="230" y2="25" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="215" y="20" font-size="11" font-weight="bold" fill="#dc2626">E(P)</text>
  </g>

  <!-- Right: Formulas -->
  <rect x="290" y="55" width="230" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="305" y="80" font-size="13" font-weight="bold" fill="#0f172a">Vektorielle Feldstärke:</text>

  <text x="305" y="105" font-size="11" fill="#64748b">Verbindungsvektor:</text>
  <text x="305" y="122" font-size="12" font-weight="bold" fill="#0f172a">r = r_P − r_q</text>
  <text x="305" y="140" font-size="11" fill="#64748b">Einheitsvektor e_r = r / |r|</text>

  <line x1="305" y1="150" x2="505" y2="150" stroke="#e2e8f0" stroke-width="1" />

  <text x="305" y="170" font-size="11" fill="#dc2626" font-weight="bold">Superposition mehrerer Ladungen:</text>
  <text x="305" y="195" font-size="12" font-weight="bold" fill="#2563eb">E(r_P) = 1/(4πε₀) · Σ qᵢ · rᵢ / |rᵢ|³</text>
  <text x="305" y="222" font-size="10" fill="#64748b">Quelladungen beeinflussen sich nicht gegenseitig!</text>
</svg>