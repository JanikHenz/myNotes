<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Das Ampèresche Durchflutungsgesetz (∮ B · ds = μ₀ · I)</text>

  <!-- Left: Conductor with Closed Loop -->
  <g transform="translate(40, 55)">
    <!-- Vertical Conductor Wire -->
    <line x1="110" y1="10" x2="110" y2="180" stroke="#ea580c" stroke-width="5" />
    <!-- Current Arrow Upward -->
    <line x1="110" y1="60" x2="110" y2="30" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="125" y="45" font-size="12" font-weight="bold" fill="#dc2626">I</text>

    <!-- Closed Integration Path (Green Ellipse) around conductor -->
    <ellipse cx="110" cy="105" rx="65" ry="30" fill="none" stroke="#16a34a" stroke-width="2.5" />
    <!-- Path direction arrows -->
    <path d="M 175,105 A 65,30 0 0,1 110,135" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)" />
    <text x="145" y="145" font-size="11" font-weight="bold" fill="#16a34a">ds (Umlaufsinn)</text>

    <!-- Radius r line -->
    <line x1="110" y1="105" x2="175" y2="105" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="140" y="100" font-size="10" fill="#64748b">Radius r</text>
  </g>

  <!-- Right: Formulas & Rules -->
  <rect x="270" y="55" width="250" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="285" y="80" font-size="13" font-weight="bold" fill="#0f172a">Ampèresches Gesetz:</text>

  <text x="285" y="108" font-size="13" font-weight="bold" fill="#2563eb">∮ B · ds = μ₀ · Σ I</text>
  <text x="285" y="130" font-size="11" fill="#334155">Für kreisförmigen Weg um geraden Leiter:</text>

  <text x="285" y="152" font-size="12" font-weight="bold" fill="#0f172a">B · 2π r = μ₀ · I</text>
  <text x="285" y="175" font-size="13" font-weight="bold" fill="#16a34a">B(r) = (μ₀ · I) / (2π · r)</text>

  <line x1="285" y1="188" x2="505" y2="188" stroke="#e2e8f0" stroke-width="1" />
  <text x="285" y="208" font-size="10" fill="#64748b">Rechte-Faust-Regel: Daumen in Stromrichtung,</text>
  <text x="285" y="222" font-size="10" fill="#64748b">Finger zeigen Richtung des Magnetfeldes B.</text>
</svg>