<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <defs>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="420" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    N-Kanal MOSFETs: Verarmungs- vs. Anreicherungstyp
  </text>
  <text x="420" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Selbstleitend (NC: Verarmungstyp) und selbstsperrend (NO: Anreicherungstyp) mit Schaltsymbol &amp; Aufbau
  </text>

  <!-- Left: NC -->
  <rect x="40" y="85" width="365" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="222" y="112" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">N-Kanal Verarmungstyp (NC)</text>
  <text x="222" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">Normally Closed (leitend bei U_GS = 0V)</text>

  <g transform="translate(180, 170)">
    <line x1="-50" y1="60" x2="-15" y2="60" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-15" y1="20" x2="-15" y2="100" stroke="#1e293b" stroke-width="3"/>
    <text x="-65" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">G</text>
    <!-- Continuous line -->
    <line x1="0" y1="20" x2="0" y2="100" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="25" x2="40" y2="25" stroke="#1e293b" stroke-width="2.5"/><line x1="40" y1="25" x2="40" y2="0" stroke="#1e293b" stroke-width="2.5"/>
    <text x="40" y="-6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">D</text>
    <line x1="0" y1="95" x2="40" y2="95" stroke="#1e293b" stroke-width="2.5"/><line x1="40" y1="95" x2="40" y2="120" stroke="#1e293b" stroke-width="2.5"/>
    <text x="40" y="136" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">S</text>
    <line x1="40" y1="60" x2="5" y2="60" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-sub)"/>
    <line x1="40" y1="60" x2="40" y2="95" stroke="#1e293b" stroke-width="2"/>
    <circle cx="40" cy="95" r="3" fill="#1e293b"/>
  </g>

  <!-- Structure NC -->
  <rect x="75" y="325" width="295" height="120" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="222" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">P-Substrat</text>
  <rect x="90" y="360" width="45" height="30" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <text x="112" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">N+</text>
  <rect x="310" y="360" width="45" height="30" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <text x="332" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">N+</text>
  <rect x="135" y="360" width="175" height="14" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
  <text x="222" y="372" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Vorhandener N-Kanal</text>


  <!-- Right: NO -->
  <rect x="435" y="85" width="365" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="617" y="112" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">N-Kanal Anreicherungstyp (NO)</text>
  <text x="617" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#059669" font-weight="bold" text-anchor="middle">Normally Open (sperrend bei U_GS = 0V)</text>

  <g transform="translate(575, 170)">
    <line x1="-50" y1="60" x2="-15" y2="60" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="-15" y1="20" x2="-15" y2="100" stroke="#1e293b" stroke-width="3"/>
    <text x="-65" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">G</text>
    <!-- Broken line (3 segments) -->
    <line x1="0" y1="20" x2="0" y2="40" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="50" x2="0" y2="70" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="80" x2="0" y2="100" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#1e293b" stroke-width="2.5"/><line x1="40" y1="30" x2="40" y2="0" stroke="#1e293b" stroke-width="2.5"/>
    <text x="40" y="-6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">D</text>
    <line x1="0" y1="90" x2="40" y2="90" stroke="#1e293b" stroke-width="2.5"/><line x1="40" y1="90" x2="40" y2="120" stroke="#1e293b" stroke-width="2.5"/>
    <text x="40" y="136" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">S</text>
    <line x1="40" y1="60" x2="5" y2="60" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-sub)"/>
    <line x1="40" y1="60" x2="40" y2="90" stroke="#1e293b" stroke-width="2"/>
    <circle cx="40" cy="90" r="3" fill="#1e293b"/>
  </g>

  <rect x="465" y="325" width="305" height="120" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="617" y="350" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">Steuerung über Gate-Spannung U_GS:</text>
  <text x="617" y="375" font-family="system-ui, sans-serif" font-size="12" fill="#047857" text-anchor="middle">• U_GS &lt; U_th: Sperrt (kein Inversionskanal)</text>
  <text x="617" y="395" font-family="system-ui, sans-serif" font-size="12" fill="#047857" text-anchor="middle">• U_GS &gt; U_th: Leitend (Kanal wird gebildet)</text>
</svg>