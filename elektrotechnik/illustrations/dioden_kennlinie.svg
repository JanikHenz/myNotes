<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Diodenkennlinie (Silizium-Diode &amp; Zener-Diode)</text>
  <!-- Axes -->
  <line x1="40" y1="195" x2="455" y2="195" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <line x1="200" y1="265" x2="200" y2="60" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <text x="460" y="200" font-size="12" font-weight="bold" fill="#1e293b">U_D (V)</text>
  <text x="205" y="55" font-size="12" font-weight="bold" fill="#1e293b">I_D (mA)</text>
  <!-- Forward threshold (0.7V) -->
  <line x1="270" y1="195" x2="270" y2="85" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" />
  <text x="270" y="215" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">U_S ≈ 0,7V</text>
  <!-- Forward curve (Si) -->
  <path d="M 200,195 L 250,195 Q 270,195 290,85" fill="none" stroke="#16a34a" stroke-width="3" />
  <text x="310" y="100" font-size="13" font-weight="bold" fill="#16a34a">Durchlassbereich</text>
  <!-- Reverse breakdown (Zener) -->
  <line x1="90" y1="195" x2="90" y2="250" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" />
  <text x="90" y="185" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">U_Z</text>
  <path d="M 200,195 L 100,196 Q 90,196 90,255" fill="none" stroke="#dc2626" stroke-width="2.5" />
  <text x="35" y="235" font-size="12" font-weight="bold" fill="#dc2626">Zener-Durchbruch</text>
</svg>