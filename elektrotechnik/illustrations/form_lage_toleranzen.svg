<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Form- und Lagetoleranzen (DIN EN ISO 1101)</text>

  <!-- 1. Ebenheit -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Ebenheitstoleranz</text>
    
    <!-- Workpiece block -->
    <polygon points="25,95 85,75 130,75 70,95" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
    <polygon points="25,95 70,95 70,120 25,120" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
    <polygon points="70,95 130,75 130,100 70,120" fill="#94a3b8" stroke="#64748b" stroke-width="1.2" />

    <!-- Tolerance frame -->
    <rect x="35" y="42" width="85" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
    <line x1="65" y1="42" x2="65" y2="62" stroke="#1e293b" stroke-width="1.2" />
    <text x="50" y="56" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">⏥</text>
    <text x="90" y="56" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">0,2</text>
    <line x1="77" y1="62" x2="77" y2="76" stroke="#1e293b" stroke-width="1.2" />

    <text x="77" y="150" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">[ ⏥ | 0,2 ]</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">Fläche zw. 2 Parallelen</text>
  </g>

  <!-- 2. Rechtwinkligkeit -->
  <g transform="translate(197, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Rechtwinkligkeit</text>
    
    <!-- L-shaped block -->
    <path d="M 40,75 L 60,75 L 60,100 L 115,100 L 115,120 L 40,120 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />

    <!-- Datum A at left -->
    <rect x="18" y="90" width="16" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
    <text x="26" y="102" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
    <line x1="34" y1="98" x2="40" y2="98" stroke="#1e293b" stroke-width="1.5" />

    <!-- Tolerance frame -->
    <rect x="25" y="42" width="105" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
    <line x1="55" y1="42" x2="55" y2="62" stroke="#1e293b" stroke-width="1.2" />
    <line x1="95" y1="42" x2="95" y2="62" stroke="#1e293b" stroke-width="1.2" />
    <text x="40" y="56" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">⊥</text>
    <text x="75" y="56" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">0,2</text>
    <text x="110" y="56" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
    <line x1="90" y1="62" x2="90" y2="100" stroke="#1e293b" stroke-width="1.2" />

    <text x="77" y="150" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">[ ⊥ | 0,2 | A ]</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">90° zur Bezugsfläche A</text>
  </g>

  <!-- 3. Parallelität -->
  <g transform="translate(365, 60)">
    <rect x="0" y="0" width="155" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="77" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Parallelitätstoleranz</text>
    
    <!-- Block with top and bottom parallel surfaces -->
    <rect x="35" y="80" width="85" height="35" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />

    <!-- Datum A at bottom -->
    <rect x="70" y="125" width="16" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
    <text x="78" y="137" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
    <line x1="78" y1="125" x2="78" y2="115" stroke="#1e293b" stroke-width="1.5" />

    <!-- Tolerance frame at top -->
    <rect x="25" y="42" width="105" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.2" />
    <line x1="55" y1="42" x2="55" y2="62" stroke="#1e293b" stroke-width="1.2" />
    <line x1="95" y1="42" x2="95" y2="62" stroke="#1e293b" stroke-width="1.2" />
    <text x="40" y="56" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">//</text>
    <text x="75" y="56" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">0,2</text>
    <text x="110" y="56" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>
    <line x1="78" y1="62" x2="78" y2="80" stroke="#1e293b" stroke-width="1.2" />

    <text x="77" y="150" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">[ // | 0,2 | A ]</text>
    <text x="77" y="168" font-size="10" fill="#64748b" text-anchor="middle">Parallel zu Bezugsebene A</text>
  </g>
</svg>