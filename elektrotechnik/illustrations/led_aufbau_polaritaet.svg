<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Leuchtdiode (LED) – Schaltsymbol &amp; Anschlüsse</text>
  <!-- Symbol -->
  <g transform="translate(35, 40)">
    <!-- Anode line -->
    <line x1="20" y1="70" x2="80" y2="70" stroke="#1e293b" stroke-width="2" />
    <circle cx="20" cy="70" r="4" fill="#dc2626" />
    <text x="10" y="55" font-size="12" font-weight="bold" fill="#dc2626">Anode (+)</text>
    <text x="10" y="95" font-size="11" fill="#64748b">langes Bein</text>
    <!-- Triangle -->
    <polygon points="80,50 80,90 120,70" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
    <!-- Cathode Bar -->
    <line x1="120" y1="50" x2="120" y2="90" stroke="#1e293b" stroke-width="3" />
    <!-- Cathode line -->
    <line x1="120" y1="70" x2="175" y2="70" stroke="#1e293b" stroke-width="2" />
    <circle cx="175" cy="70" r="4" fill="#2563eb" />
    <text x="175" y="55" font-size="12" font-weight="bold" fill="#2563eb">Kathode (−)</text>
    <text x="175" y="95" font-size="11" fill="#64748b">flache Seite</text>
    <!-- Light emission arrows -->
    <line x1="105" y1="45" x2="125" y2="25" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)" />
    <line x1="115" y1="52" x2="135" y2="32" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-red)" />
  </g>
  <!-- Vorwiderstand Note -->
  <rect x="305" y="75" width="195" height="85" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="318" y="100" font-size="12" font-weight="bold" fill="#1e40af">Vorwiderstand:</text>
  <text x="318" y="124" font-size="12" font-weight="bold" fill="#0f172a">R_V = (U_B − U_LED) / I_F</text>
  <text x="318" y="145" font-size="11" fill="#64748b">z. B. I_F = 10...20 mA</text>
</svg>