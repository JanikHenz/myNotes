<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Lorentzkraft auf stromdurchflossenen Leiter (UVW-Regel)</text>
  <!-- Conductor wire -->
  <rect x="50" y="130" width="240" height="20" fill="#fed7aa" stroke="#ea580c" stroke-width="2" rx="4" />
  <!-- Current I (Ursache) -->
  <line x1="60" y1="140" x2="270" y2="140" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="50" y="122" font-size="12" font-weight="bold" fill="#16a34a">Strom I (Daumen / Ursache)</text>

  <!-- Magnetic Field B (Vermittlung - into page / out of page or down) -->
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)">
    <line x1="120" y1="60" x2="120" y2="120" />
    <line x1="170" y1="60" x2="170" y2="120" />
    <line x1="220" y1="60" x2="220" y2="120" />
  </g>
  <text x="170" y="55" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">Magnetfeld B (Zeigefinger)</text>

  <!-- Force F (Wirkung - into/out or sideways) -->
  <line x1="170" y1="150" x2="170" y2="230" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)" />
  <text x="182" y="215" font-size="13" font-weight="bold" fill="#dc2626">Kraft F (Mittelfinger)</text>

  <!-- UVW Legend Box -->
  <rect x="330" y="55" width="190" height="150" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="345" y="80" font-size="13" font-weight="bold" fill="#1e40af">UVW-Regel:</text>
  <text x="345" y="104" font-size="12" fill="#16a34a" font-weight="bold">U = Ursache (I)</text>
  <text x="345" y="126" font-size="12" fill="#2563eb" font-weight="bold">V = Vermittlung (B)</text>
  <text x="345" y="148" font-size="12" fill="#dc2626" font-weight="bold">W = Wirkung (F)</text>
  <line x1="345" y1="162" x2="505" y2="162" stroke="#bfdbfe" stroke-width="1" />
  <text x="345" y="184" font-size="12" font-weight="bold" fill="#0f172a">F = I · (L × B)</text>
</svg>