<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Messtechnik-Grundregeln: Spannungs- vs. Strommessung</text>

  <!-- Left: Voltage Measurement (Parallel) -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="230" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Spannungsmessung (PARALLEL)</text>

    <!-- Circuit with load RL -->
    <line x1="20" y1="65" x2="80" y2="65" stroke="#1e293b" stroke-width="2" />
    <rect x="80" y="55" width="45" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="102" y="69" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">R_L</text>
    <line x1="125" y1="65" x2="190" y2="65" stroke="#1e293b" stroke-width="2" />

    <!-- Voltmeter parallel across RL -->
    <line x1="50" y1="65" x2="50" y2="105" stroke="#1e293b" stroke-width="1.5" />
    <line x1="50" y1="105" x2="87" y2="105" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="102" cy="105" r="15" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <text x="102" y="110" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">V</text>
    <line x1="117" y1="105" x2="160" y2="105" stroke="#1e293b" stroke-width="1.5" />
    <line x1="160" y1="105" x2="160" y2="65" stroke="#1e293b" stroke-width="1.5" />

    <text x="115" y="145" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">R_V → ∞ (HOCHOHMIG)</text>
    <text x="115" y="165" font-size="10" fill="#64748b" text-anchor="middle">Darf keinen Strom entziehen!</text>
  </g>

  <!-- Right: Current Measurement (Series) -->
  <g transform="translate(280, 55)">
    <rect x="0" y="0" width="230" height="185" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Strommessung (IN REIHE)</text>

    <!-- Ammeter in series with RL -->
    <line x1="20" y1="80" x2="50" y2="80" stroke="#1e293b" stroke-width="2" />
    <circle cx="65" cy="80" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="65" y="85" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
    <line x1="80" y1="80" x2="115" y2="80" stroke="#1e293b" stroke-width="2" />

    <!-- RL -->
    <rect x="115" y="70" width="45" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="137" y="84" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">R_L</text>
    <line x1="160" y1="80" x2="195" y2="80" stroke="#1e293b" stroke-width="2" />

    <text x="115" y="145" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">R_A → 0 (NIEDEROHMIG)</text>
    <text x="115" y="165" font-size="10" fill="#64748b" text-anchor="middle">Darf keinen Spannungsabfall erzeugen!</text>
  </g>
</svg>