<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Kollektorschaltung (Emitterfolger / Impedanzwandler)</text>
  <line x1="60" y1="50" x2="400" y2="50" stroke="#dc2626" stroke-width="2" />
  <text x="410" y="55" font-size="13" font-weight="bold" fill="#dc2626">+U_CC</text>
  <line x1="60" y1="230" x2="400" y2="230" stroke="#1e293b" stroke-width="2" />
  <text x="410" y="235" font-size="13" font-weight="bold" fill="#1e293b">GND</text>
  <!-- Direct Connection Collector to V_CC -->
  <line x1="260" y1="115" x2="260" y2="50" stroke="#1e293b" stroke-width="2" />
  <!-- NPN Transistor -->
  <circle cx="250" cy="130" r="22" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5" />
  <line x1="238" y1="115" x2="238" y2="145" stroke="#1e293b" stroke-width="3" />
  <line x1="260" y1="115" x2="238" y2="123" stroke="#1e293b" stroke-width="2" />
  <line x1="238" y1="137" x2="260" y2="145" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <!-- Input to Base -->
  <line x1="80" y1="130" x2="238" y2="130" stroke="#16a34a" stroke-width="2" />
  <circle cx="80" cy="130" r="4" fill="#16a34a" />
  <text x="50" y="135" font-size="14" font-weight="bold" fill="#16a34a">U_e</text>
  <!-- Emitter Resistor R_E -->
  <line x1="260" y1="145" x2="260" y2="170" stroke="#1e293b" stroke-width="2" />
  <rect x="250" y="170" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="225" y="192" font-size="12" font-weight="bold" fill="#0f172a">R_E</text>
  <line x1="260" y1="205" x2="260" y2="230" stroke="#1e293b" stroke-width="2" />
  <!-- Output from Emitter -->
  <circle cx="260" cy="155" r="3" fill="#2563eb" />
  <line x1="260" y1="155" x2="350" y2="155" stroke="#2563eb" stroke-width="2" />
  <circle cx="350" cy="155" r="4" fill="#2563eb" />
  <text x="360" y="160" font-size="14" font-weight="bold" fill="#2563eb">U_a ≈ U_e</text>
  <!-- Properties box -->
  <rect x="70" y="170" width="140" height="45" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="80" y="188" font-size="11" font-weight="bold" fill="#1e40af">Verstärkung: v_u ≈ 1</text>
  <text x="80" y="204" font-size="11" fill="#1e40af">R_in hoch, R_out klein</text>
</svg>