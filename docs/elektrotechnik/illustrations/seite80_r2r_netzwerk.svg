<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">3-Bit R-2R-Widerstandsleiter-Netzwerk (D/A-Wandler)</text>
  <!-- Horizontal R resistors -->
  <rect x="140" y="70" width="35" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="157" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
  <rect x="250" y="70" width="35" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="267" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
  <rect x="360" y="70" width="35" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="377" y="85" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R</text>
  <!-- Horizontal wire -->
  <line x1="80" y1="80" x2="140" y2="80" stroke="#1e293b" stroke-width="2" />
  <line x1="175" y1="80" x2="250" y2="80" stroke="#1e293b" stroke-width="2" />
  <line x1="285" y1="80" x2="360" y2="80" stroke="#1e293b" stroke-width="2" />
  <line x1="395" y1="80" x2="470" y2="80" stroke="#2563eb" stroke-width="2" />
  <circle cx="470" cy="80" r="4" fill="#2563eb" />
  <text x="480" y="85" font-size="14" font-weight="bold" fill="#2563eb">U_out</text>
  <!-- Vertical 2R resistors -->
  <!-- Left GND branch -->
  <line x1="80" y1="80" x2="80" y2="120" stroke="#1e293b" stroke-width="2" />
  <rect x="70" y="120" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="80" y="142" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2R</text>
  <line x1="80" y1="155" x2="80" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="70" y1="190" x2="90" y2="190" stroke="#1e293b" stroke-width="2" />
  <!-- Bit 0 branch -->
  <circle cx="190" cy="80" r="3" fill="#1e293b" />
  <line x1="190" y1="80" x2="190" y2="120" stroke="#1e293b" stroke-width="2" />
  <rect x="180" y="120" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="190" y="142" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2R</text>
  <circle cx="190" cy="180" r="4" fill="#16a34a" />
  <text x="190" y="205" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Bit 0 (LSB)</text>
  <!-- Bit 1 branch -->
  <circle cx="300" cy="80" r="3" fill="#1e293b" />
  <line x1="300" y1="80" x2="300" y2="120" stroke="#1e293b" stroke-width="2" />
  <rect x="290" y="120" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="300" y="142" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2R</text>
  <circle cx="300" cy="180" r="4" fill="#16a34a" />
  <text x="300" y="205" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Bit 1</text>
  <!-- Bit 2 branch -->
  <circle cx="410" cy="80" r="3" fill="#1e293b" />
  <line x1="410" y1="80" x2="410" y2="120" stroke="#1e293b" stroke-width="2" />
  <rect x="400" y="120" width="20" height="35" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="410" y="142" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">2R</text>
  <circle cx="410" cy="180" r="4" fill="#16a34a" />
  <text x="410" y="205" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Bit 2 (MSB)</text>
</svg>