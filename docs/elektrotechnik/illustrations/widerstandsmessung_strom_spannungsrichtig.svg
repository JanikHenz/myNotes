<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Indirekte Widerstandsmessung (Strom- vs. Spannungsrichtig)</text>

  <!-- Left: Stromrichtig -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="235" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Stromrichtige Schaltung</text>
    
    <!-- Ammeter in series right before Rx -->
    <line x1="25" y1="70" x2="65" y2="70" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="80" cy="70" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="80" y="74" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
    <line x1="94" y1="70" x2="135" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Rx -->
    <rect x="135" y="60" width="35" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="152" y="74" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Rx</text>
    <line x1="170" y1="70" x2="210" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Voltmeter across BOTH (A + Rx) -->
    <line x1="45" y1="70" x2="45" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <line x1="45" y1="120" x2="100" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="115" cy="120" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="115" y="124" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">V</text>
    <line x1="129" y1="120" x2="190" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <line x1="190" y1="120" x2="190" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Evaluation -->
    <text x="117" y="152" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Ideal für GROSSE Rx (Rx &gt;&gt; R_A)</text>
    <text x="117" y="168" font-size="10" fill="#64748b" text-anchor="middle">A misst exakt I_Rx; V misst U_Rx + U_A</text>
  </g>

  <!-- Right: Spannungsrichtig -->
  <g transform="translate(285, 60)">
    <rect x="0" y="0" width="235" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Spannungsrichtige Schaltung</text>
    
    <!-- Ammeter first -->
    <line x1="25" y1="70" x2="50" y2="70" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="65" cy="70" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="74" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">A</text>
    <line x1="79" y1="70" x2="140" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Rx -->
    <rect x="140" y="60" width="35" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="157" y="74" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">Rx</text>
    <line x1="175" y1="70" x2="210" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Voltmeter directly across Rx only -->
    <line x1="120" y1="70" x2="120" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <line x1="120" y1="120" x2="140" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="155" cy="120" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="155" y="124" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">V</text>
    <line x1="169" y1="120" x2="190" y2="120" stroke="#1e293b" stroke-width="1.5" />
    <line x1="190" y1="120" x2="190" y2="70" stroke="#1e293b" stroke-width="1.5" />

    <!-- Evaluation -->
    <text x="117" y="152" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Ideal für KLEINE Rx (Rx &lt;&lt; R_V)</text>
    <text x="117" y="168" font-size="10" fill="#64748b" text-anchor="middle">V misst exakt U_Rx; A misst I_Rx + I_V</text>
  </g>
</svg>