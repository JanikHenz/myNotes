<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Unbelasteter Spannungsteiler</text>
  <!-- Supply rails -->
  <line x1="100" y1="60" x2="200" y2="60" stroke="#1e293b" stroke-width="2" />
  <line x1="200" y1="60" x2="200" y2="90" stroke="#1e293b" stroke-width="2" />
  <!-- Resistor R1 -->
  <rect x="188" y="90" width="24" height="45" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="225" y="117" font-size="14" font-weight="bold" fill="#0f172a">R₁</text>
  <!-- Connection between R1 and R2 -->
  <line x1="200" y1="135" x2="200" y2="160" stroke="#1e293b" stroke-width="2" />
  <circle cx="200" cy="147" r="4" fill="#1e293b" />
  <line x1="200" y1="147" x2="320" y2="147" stroke="#2563eb" stroke-width="2" />
  <circle cx="320" cy="147" r="4" fill="#2563eb" />
  <!-- Resistor R2 -->
  <rect x="188" y="160" width="24" height="45" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="225" y="187" font-size="14" font-weight="bold" fill="#0f172a">R₂</text>
  <!-- Ground rail -->
  <line x1="200" y1="205" x2="200" y2="235" stroke="#1e293b" stroke-width="2" />
  <line x1="100" y1="235" x2="320" y2="235" stroke="#1e293b" stroke-width="2" />
  <circle cx="320" cy="235" r="4" fill="#2563eb" />
  <!-- Input voltage U0 arrow -->
  <line x1="100" y1="70" x2="100" y2="225" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow-dark)" />
  <text x="65" y="152" font-size="14" font-weight="bold" fill="#1e293b">U₀</text>
  <!-- Output voltage U2 arrow -->
  <line x1="320" y1="155" x2="320" y2="227" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330" y="195" font-size="14" font-weight="bold" fill="#2563eb">U₂</text>
  <!-- Formula Box -->
  <rect x="270" y="65" width="170" height="50" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="280" y="95" font-size="14" font-weight="bold" fill="#1e40af">U₂ = U₀ · R₂ / (R₁ + R₂)</text>
</svg>