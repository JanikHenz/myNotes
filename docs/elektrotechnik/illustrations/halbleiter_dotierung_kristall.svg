<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Halbleiterdotierung: n-Dotierung vs. p-Dotierung</text>

  <!-- Left: n-Dotierung (Donator) -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="235" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">n-Dotierung (Donator)</text>
    
    <!-- Silicon Lattice with Phosphor in center -->
    <!-- Si Top -->
    <circle cx="117" cy="55" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="117" y="59" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <!-- Si Left -->
    <circle cx="67" cy="95" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="67" y="99" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <!-- Phosphor Center (Donator 5th val electron) -->
    <circle cx="117" cy="95" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
    <text x="117" y="99" font-size="11" fill="#dc2626" font-weight="bold" text-anchor="middle">P (5)</text>
    <!-- Si Right -->
    <circle cx="167" cy="95" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="167" y="99" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <!-- Si Bottom -->
    <circle cx="117" cy="135" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="117" y="139" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>

    <!-- Lattice bonds -->
    <line x1="117" y1="69" x2="117" y2="79" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="81" y1="95" x2="101" y2="95" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="133" y1="95" x2="153" y2="95" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="117" y1="111" x2="117" y2="121" stroke="#94a3b8" stroke-width="1.5" />

    <!-- 5th free electron -->
    <circle cx="145" cy="72" r="5" fill="#3b82f6" />
    <text x="155" y="70" font-size="10" font-weight="bold" fill="#2563eb">e⁻ frei</text>

    <text x="117" y="162" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">Elektronenüberschuss</text>
    <text x="117" y="178" font-size="10" fill="#64748b" text-anchor="middle">Majoritätsträger: negative Elektronen</text>
  </g>

  <!-- Right: p-Dotierung (Akzeptor) -->
  <g transform="translate(285, 55)">
    <rect x="0" y="0" width="235" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="117" y="24" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">p-Dotierung (Akzeptor)</text>
    
    <!-- Silicon Lattice with Boron in center -->
    <circle cx="117" cy="55" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="117" y="59" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <circle cx="67" cy="95" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="67" y="99" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <!-- Boron Center (Akzeptor 3 val electrons -> hole) -->
    <circle cx="117" cy="95" r="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
    <text x="117" y="99" font-size="11" fill="#1e40af" font-weight="bold" text-anchor="middle">B (3)</text>
    <circle cx="167" cy="95" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="167" y="99" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>
    <circle cx="117" cy="135" r="14" fill="#e2e8f0" stroke="#64748b" />
    <text x="117" y="139" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Si</text>

    <!-- Lattice bonds -->
    <line x1="117" y1="69" x2="117" y2="79" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="81" y1="95" x2="101" y2="95" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="133" y1="95" x2="153" y2="95" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="117" y1="111" x2="117" y2="121" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Defect electron / hole -->
    <circle cx="145" cy="72" r="5" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,1" />
    <text x="155" y="70" font-size="10" font-weight="bold" fill="#ef4444">Loch h⁺</text>

    <text x="117" y="162" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Elektronenmangel (Löcher)</text>
    <text x="117" y="178" font-size="10" fill="#64748b" text-anchor="middle">Majoritätsträger: positive Defektelektronen</text>
  </g>
</svg>