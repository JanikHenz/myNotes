<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Nicht-invertierender Verstärker (Elektrometerverstärker)</text>

  <!-- OpAmp Triangle -->
  <polygon points="180,80 180,200 290,140" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="195" y="115" font-size="16" font-weight="bold" fill="#16a34a">+</text>
  <text x="195" y="175" font-size="16" font-weight="bold" fill="#1e293b">−</text>

  <!-- Input Ue to + -->
  <line x1="80" y1="110" x2="180" y2="110" stroke="#16a34a" stroke-width="2" />
  <circle cx="80" cy="110" r="4" fill="#16a34a" />
  <text x="45" y="115" font-size="14" font-weight="bold" fill="#16a34a">U_e</text>

  <!-- Output -->
  <line x1="290" y1="140" x2="430" y2="140" stroke="#2563eb" stroke-width="2" />
  <circle cx="430" cy="140" r="4" fill="#2563eb" />
  <text x="440" y="145" font-size="14" font-weight="bold" fill="#2563eb">U_a</text>

  <!-- Feedback loop to - input -->
  <circle cx="350" cy="140" r="3" fill="#1e293b" />
  <line x1="350" y1="140" x2="350" y2="215" stroke="#1e293b" stroke-width="2" />
  <line x1="350" y1="215" x2="260" y2="215" stroke="#1e293b" stroke-width="2" />

  <!-- R2 Feedback -->
  <rect x="220" y="205" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="240" y="220" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₂</text>
  <line x1="220" y1="215" x2="140" y2="215" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="215" x2="140" y2="170" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="170" x2="180" y2="170" stroke="#1e293b" stroke-width="2" />

  <!-- R1 to GND -->
  <circle cx="140" cy="215" r="3.5" fill="#1e293b" />
  <line x1="140" y1="215" x2="140" y2="235" stroke="#1e293b" stroke-width="2" />
  <rect x="130" y="235" width="20" height="30" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="122" y="254" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="end">R₁</text>
  <line x1="140" y1="265" x2="140" y2="278" stroke="#1e293b" stroke-width="2" />
  <line x1="125" y1="278" x2="155" y2="278" stroke="#1e293b" stroke-width="2" />

  <!-- Formula Callout Top Right -->
  <rect x="300" y="55" width="185" height="45" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="392" y="82" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">U_a = U_e · (1 + R₂ / R₁)</text>
</svg>