<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Subtrahierender Operationsverstärker (Differenzverstärker)</text>
  <!-- OpAmp Triangle -->
  <polygon points="210,80 210,200 320,140" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="225" y="115" font-size="16" font-weight="bold" fill="#1e293b">−</text>
  <text x="225" y="175" font-size="16" font-weight="bold" fill="#1e293b">+</text>
  <!-- Inverting Path: U1 -> R1 -> (-) -->
  <circle cx="60" cy="110" r="4" fill="#dc2626" />
  <text x="35" y="115" font-size="14" font-weight="bold" fill="#dc2626">U₁</text>
  <line x1="60" y1="110" x2="100" y2="110" stroke="#1e293b" stroke-width="2" />
  <rect x="100" y="100" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="120" y="115" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₁</text>
  <line x1="140" y1="110" x2="210" y2="110" stroke="#1e293b" stroke-width="2" />
  <!-- Feedback R2 -->
  <circle cx="175" cy="110" r="3" fill="#1e293b" />
  <line x1="175" y1="110" x2="175" y2="60" stroke="#1e293b" stroke-width="2" />
  <line x1="175" y1="60" x2="240" y2="60" stroke="#1e293b" stroke-width="2" />
  <rect x="240" y="50" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="260" y="65" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₂</text>
  <line x1="280" y1="60" x2="350" y2="60" stroke="#1e293b" stroke-width="2" />
  <line x1="350" y1="60" x2="350" y2="140" stroke="#1e293b" stroke-width="2" />
  <!-- Non-Inverting Path: U2 -> R3 -> (+) -->
  <circle cx="60" cy="170" r="4" fill="#16a34a" />
  <text x="35" y="175" font-size="14" font-weight="bold" fill="#16a34a">U₂</text>
  <line x1="60" y1="170" x2="100" y2="170" stroke="#1e293b" stroke-width="2" />
  <rect x="100" y="160" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="120" y="175" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₃</text>
  <line x1="140" y1="170" x2="210" y2="170" stroke="#1e293b" stroke-width="2" />
  <!-- R4 to GND -->
  <circle cx="175" cy="170" r="3" fill="#1e293b" />
  <line x1="175" y1="170" x2="175" y2="205" stroke="#1e293b" stroke-width="2" />
  <rect x="165" y="205" width="20" height="40" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="195" y="230" font-size="12" font-weight="bold" fill="#0f172a">R₄</text>
  <line x1="175" y1="245" x2="175" y2="265" stroke="#1e293b" stroke-width="2" />
  <line x1="160" y1="265" x2="190" y2="265" stroke="#1e293b" stroke-width="2" />
  <!-- Output -->
  <line x1="320" y1="140" x2="430" y2="140" stroke="#2563eb" stroke-width="2" />
  <circle cx="430" cy="140" r="4" fill="#2563eb" />
  <text x="440" y="145" font-size="14" font-weight="bold" fill="#2563eb">U_a</text>
  <!-- Formula -->
  <rect x="250" y="240" width="200" height="45" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="260" y="258" font-size="11" font-weight="bold" fill="#1e40af">Wenn R₁ = R₃ und R₂ = R₄:</text>
  <text x="260" y="275" font-size="13" font-weight="bold" fill="#1e40af">U_a = (R₂ / R₁) · (U₂ − U₁)</text>
</svg>