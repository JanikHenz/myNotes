<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Bistabile Kippstufe (Flip-Flop) aus diskreten Transistoren</text>

  <!-- Left: Symmetrical Transistor Schematic -->
  <g transform="translate(40, 50)">
    <!-- +VCC Top Rail -->
    <line x1="20" y1="15" x2="220" y2="15" stroke="#dc2626" stroke-width="2" />
    <text x="120" y="10" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">+V_CC</text>

    <!-- Transistor T1 Left -->
    <rect x="50" y="100" width="16" height="25" fill="#f8fafc" stroke="#1e293b" />
    <text x="40" y="115" font-size="9" font-weight="bold" fill="#2563eb">T₁</text>
    <!-- Collector pullup RC1 -->
    <line x1="58" y1="15" x2="58" y2="40" stroke="#1e293b" stroke-width="1.8" />
    <rect x="51" y="40" width="14" height="25" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <line x1="58" y1="65" x2="58" y2="100" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="58" cy="80" r="2.5" fill="#1e293b" />
    <text x="35" y="84" font-size="11" font-weight="bold" fill="#2563eb">Q</text>

    <!-- Transistor T2 Right -->
    <rect x="174" y="100" width="16" height="25" fill="#f8fafc" stroke="#1e293b" />
    <text x="195" y="115" font-size="9" font-weight="bold" fill="#dc2626">T₂</text>
    <!-- Collector pullup RC2 -->
    <line x1="182" y1="15" x2="182" y2="40" stroke="#1e293b" stroke-width="1.8" />
    <rect x="175" y="40" width="14" height="25" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <line x1="182" y1="65" x2="182" y2="100" stroke="#1e293b" stroke-width="1.8" />
    <circle cx="182" cy="80" r="2.5" fill="#1e293b" />
    <text x="200" y="84" font-size="11" font-weight="bold" fill="#dc2626">Q̄</text>

    <!-- Cross-Coupling Resistors (Diagonal X) -->
    <line x1="58" y1="80" x2="110" y2="95" stroke="#1e293b" stroke-width="1.5" />
    <rect x="110" y="90" width="20" height="10" fill="#ffffff" stroke="#1e293b" />
    <line x1="130" y1="100" x2="174" y2="112" stroke="#1e293b" stroke-width="1.5" />

    <line x1="182" y1="80" x2="130" y2="95" stroke="#1e293b" stroke-width="1.5" />
    <line x1="110" y1="100" x2="66" y2="112" stroke="#1e293b" stroke-width="1.5" />

    <!-- Emitters to GND -->
    <line x1="58" y1="125" x2="58" y2="155" stroke="#1e293b" stroke-width="1.8" />
    <line x1="182" y1="125" x2="182" y2="155" stroke="#1e293b" stroke-width="1.8" />
    <line x1="20" y1="155" x2="220" y2="155" stroke="#1e293b" stroke-width="2" />
    <text x="120" y="170" font-size="10" fill="#1e293b" text-anchor="middle">GND</text>
  </g>

  <!-- Right: Truth Table / Behavior -->
  <rect x="280" y="50" width="230" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="295" y="75" font-size="12" font-weight="bold" fill="#0f172a">Zwei stabile Zustände:</text>

  <text x="295" y="100" font-size="11" fill="#2563eb" font-weight="bold">Zustand 1 (Setzen):</text>
  <text x="295" y="115" font-size="10" fill="#334155">T₁ leitet (U_CE1 ≈ 0 V) ⇒ T₂ sperrt</text>
  <text x="295" y="130" font-size="10" font-weight="bold" fill="#0f172a">Q = 1 (HIGH), Q̄ = 0 (LOW)</text>

  <line x1="295" y1="142" x2="495" y2="142" stroke="#e2e8f0" stroke-width="1" />

  <text x="295" y="160" font-size="11" fill="#dc2626" font-weight="bold">Zustand 2 (Rücksetzen):</text>
  <text x="295" y="175" font-size="10" fill="#334155">T₂ leitet (U_CE2 ≈ 0 V) ⇒ T₁ sperrt</text>
  <text x="295" y="190" font-size="10" font-weight="bold" fill="#0f172a">Q = 0 (LOW), Q̄ = 1 (HIGH)</text>

  <text x="295" y="218" font-size="9" fill="#16a34a" font-weight="bold">Grundlage statischer RAM-Zellen (SRAM)</text>
</svg>