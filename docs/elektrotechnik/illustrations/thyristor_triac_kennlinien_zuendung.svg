<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Thyristor (SCR) &amp; Triac: Kennlinien &amp; Zündverhalten</text>

  <!-- Left: Thyristor I-V Curve -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="230" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="18" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Thyristor (SCR, Einweg)</text>

    <!-- Axes -->
    <line x1="20" y1="95" x2="210" y2="95" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <line x1="115" y1="150" x2="115" y2="38" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <text x="215" y="99" font-size="10" fill="#1e293b">U_AK</text>
    <text x="105" y="38" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="end">I_A</text>

    <!-- Forward blocking and snapback into conduction -->
    <path d="M 115,95 L 180,95 L 125,55 L 125,42" fill="none" stroke="#2563eb" stroke-width="2" />
    <circle cx="125" cy="70" r="3" fill="#dc2626" />
    <text x="135" y="73" font-size="9" font-weight="bold" fill="#dc2626">I_H (Haltestrom)</text>

    <!-- Reverse breakdown -->
    <path d="M 115,95 L 50,95 L 50,140" fill="none" stroke="#64748b" stroke-width="1.5" />

    <text x="115" y="160" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">Zündung durch Gate-Strom I_G</text>
    <text x="115" y="175" font-size="9" fill="#64748b" text-anchor="middle">Löschung nur durch Nulldurchgang!</text>
  </g>

  <!-- Right: Triac (AC Bidirectional) -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="230" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="18" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Triac (Zweiweg / Wechselstrom)</text>

    <!-- Symmetrical Axes -->
    <line x1="20" y1="95" x2="210" y2="95" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <line x1="115" y1="150" x2="115" y2="38" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-dark)" />
    <text x="215" y="99" font-size="10" fill="#1e293b">U</text>
    <text x="105" y="38" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="end">I</text>

    <!-- Symmetrical in Quad 1 and Quad 3 -->
    <path d="M 115,95 L 165,95 L 130,58 L 130,42" fill="none" stroke="#16a34a" stroke-width="2" />
    <path d="M 115,95 L 65,95 L 100,132 L 100,148" fill="none" stroke="#16a34a" stroke-width="2" />

    <text x="115" y="162" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Leitet in BEIDE Richtungen</text>
    <text x="115" y="176" font-size="9" fill="#64748b" text-anchor="middle">Ideal für Phasenanschnitt / Dimmer</text>
  </g>
</svg>