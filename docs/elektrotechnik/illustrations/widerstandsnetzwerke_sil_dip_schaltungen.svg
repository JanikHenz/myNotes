<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="425" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Widerstandsnetzwerke: SIL (SIP) &amp; DIP (DIL) Innenbeschaltung
  </text>
  <text x="425" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Standardisierte Mehrfachwiderstände in Sternschaltung (Bus) oder getrennten Einzelelementen
  </text>

  <!-- Left: SIL -->
  <rect x="40" y="85" width="365" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="222" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">
    SIL / SIP (Single In-Line)
  </text>

  <text x="60" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">A) Sternschaltung (Common Bus)</text>
  <line x1="70" y1="170" x2="350" y2="170" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="70" cy="170" r="5" fill="#dc2626"/>
  <line x1="70" y1="170" x2="70" y2="250" stroke="#0f172a" stroke-width="2"/>
  <circle cx="70" cy="250" r="4" fill="#0f172a"/>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Pin 1 (COM)</text>

  <!-- R1-R4 -->
  <g stroke="#0f172a" stroke-width="2">
    <line x1="140" y1="170" x2="140" y2="185"/><rect x="133" y="185" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="140" y1="215" x2="140" y2="250"/><circle cx="140" cy="250" r="4" fill="#0f172a"/>
    <line x1="200" y1="170" x2="200" y2="185"/><rect x="193" y="185" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="200" y1="215" x2="200" y2="250"/><circle cx="200" cy="250" r="4" fill="#0f172a"/>
    <line x1="260" y1="170" x2="260" y2="185"/><rect x="253" y="185" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="260" y1="215" x2="260" y2="250"/><circle cx="260" cy="250" r="4" fill="#0f172a"/>
    <line x1="320" y1="170" x2="320" y2="185"/><rect x="313" y="185" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="320" y1="215" x2="320" y2="250"/><circle cx="320" cy="250" r="4" fill="#0f172a"/>
  </g>
  <text x="140" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Pin 2</text>
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Pin 3</text>
  <text x="260" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Pin 4</text>
  <text x="320" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Pin 5</text>

  <text x="60" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#059669">B) Getrennte Einzelelemente</text>
  <g stroke="#0f172a" stroke-width="2">
    <line x1="120" y1="335" x2="120" y2="350"/><rect x="113" y="350" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="120" y1="380" x2="120" y2="420"/><circle cx="120" cy="335" r="4" fill="#0f172a"/><circle cx="120" cy="420" r="4" fill="#0f172a"/>
    <line x1="210" y1="335" x2="210" y2="350"/><rect x="203" y="350" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="210" y1="380" x2="210" y2="420"/><circle cx="210" cy="335" r="4" fill="#0f172a"/><circle cx="210" cy="420" r="4" fill="#0f172a"/>
    <line x1="300" y1="335" x2="300" y2="350"/><rect x="293" y="350" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="300" y1="380" x2="300" y2="420"/><circle cx="300" cy="335" r="4" fill="#0f172a"/><circle cx="300" cy="420" r="4" fill="#0f172a"/>
  </g>
  <text x="120" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">1 - 2</text>
  <text x="210" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">3 - 4</text>
  <text x="300" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">5 - 6</text>

  <!-- Right: DIP -->
  <rect x="445" y="85" width="365" height="385" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="627" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">
    DIP / DIL (Dual In-Line)
  </text>
  <text x="465" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">A) Zentraler Bus (Alternierend)</text>
  <line x1="480" y1="210" x2="780" y2="210" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="480" cy="210" r="5" fill="#dc2626"/>
  <text x="475" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">COM</text>

  <!-- DIP Bus Resistors -->
  <g stroke="#0f172a" stroke-width="2">
    <!-- top -->
    <line x1="530" y1="210" x2="530" y2="195"/><rect x="523" y="165" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="530" y1="165" x2="530" y2="150"/><circle cx="530" cy="150" r="4" fill="#0f172a"/>
    <line x1="630" y1="210" x2="630" y2="195"/><rect x="623" y="165" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="630" y1="165" x2="630" y2="150"/><circle cx="630" cy="150" r="4" fill="#0f172a"/>
    <line x1="730" y1="210" x2="730" y2="195"/><rect x="723" y="165" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="730" y1="165" x2="730" y2="150"/><circle cx="730" cy="150" r="4" fill="#0f172a"/>
    <!-- bottom -->
    <line x1="580" y1="210" x2="580" y2="225"/><rect x="573" y="225" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="580" y1="255" x2="580" y2="270"/><circle cx="580" cy="270" r="4" fill="#0f172a"/>
    <line x1="680" y1="210" x2="680" y2="225"/><rect x="673" y="225" width="14" height="30" fill="#ffffff" stroke="#2563eb"/><line x1="680" y1="255" x2="680" y2="270"/><circle cx="680" cy="270" r="4" fill="#0f172a"/>
  </g>

  <!-- DIP Isolated -->
  <text x="465" y="315" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#059669">B) 4 isolierte Einzelwiderstände</text>
  <g transform="translate(500, 335)" stroke="#0f172a" stroke-width="2">
    <line x1="0" y1="0" x2="0" y2="20"/><rect x="-7" y="20" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="0" y1="50" x2="0" y2="70"/><circle cx="0" cy="0" r="4" fill="#0f172a"/><circle cx="0" cy="70" r="4" fill="#0f172a"/>
    <line x1="70" y1="0" x2="70" y2="20"/><rect x="63" y="20" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="70" y1="50" x2="70" y2="70"/><circle cx="70" cy="0" r="4" fill="#0f172a"/><circle cx="70" cy="70" r="4" fill="#0f172a"/>
    <line x1="140" y1="0" x2="140" y2="20"/><rect x="133" y="20" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="140" y1="50" x2="140" y2="70"/><circle cx="140" cy="0" r="4" fill="#0f172a"/><circle cx="140" cy="70" r="4" fill="#0f172a"/>
    <line x1="210" y1="0" x2="210" y2="20"/><rect x="203" y="20" width="14" height="30" fill="#ffffff" stroke="#059669"/><line x1="210" y1="50" x2="210" y2="70"/><circle cx="210" cy="0" r="4" fill="#0f172a"/><circle cx="210" cy="70" r="4" fill="#0f172a"/>
  </g>
</svg>