<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Spannungsteiler mit Potentiometer (2-teilig vs. 3-teilig)</text>

  <!-- Left: 2-stage (Rv + Rpot) -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="230" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="20" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">2-teilig: R_v + R_pot</text>

    <!-- Circuit -->
    <text x="80" y="42" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">+10 V</text>
    <line x1="80" y1="46" x2="80" y2="56" stroke="#1e293b" stroke-width="1.8" />

    <rect x="72" y="56" width="16" height="24" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="72" font-size="9" fill="#0f172a" text-anchor="end">Rv = 1 kΩ</text>

    <line x1="80" y1="80" x2="80" y2="92" stroke="#1e293b" stroke-width="1.8" />
    <rect x="72" y="92" width="16" height="34" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="112" font-size="9" fill="#0f172a" text-anchor="end">Rpot = 10 kΩ</text>
    <!-- Wiper -->
    <line x1="88" y1="109" x2="135" y2="109" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="135" cy="109" r="2.5" fill="#dc2626" />
    <text x="142" y="113" font-size="10" font-weight="bold" fill="#dc2626">U_out</text>

    <line x1="80" y1="126" x2="80" y2="140" stroke="#1e293b" stroke-width="1.8" />
    <text x="80" y="152" font-size="9" fill="#1e293b" text-anchor="middle">GND</text>

    <text x="115" y="174" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">U_out,min = 0 V</text>
    <text x="115" y="192" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">U_out,max = 10V · 10/11 ≈ 9,09 V</text>
  </g>

  <!-- Right: 3-stage (Rv + Rpot + Rn) -->
  <g transform="translate(280, 50)">
    <rect x="0" y="0" width="230" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="115" y="20" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">3-teilig: Rv + Rpot + Rn</text>

    <text x="80" y="42" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">+10 V</text>
    <line x1="80" y1="46" x2="80" y2="54" stroke="#1e293b" stroke-width="1.8" />

    <rect x="72" y="54" width="16" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="68" font-size="8" fill="#0f172a" text-anchor="end">Rv</text>

    <line x1="80" y1="74" x2="80" y2="84" stroke="#1e293b" stroke-width="1.8" />
    <rect x="72" y="84" width="16" height="28" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="101" font-size="8" fill="#0f172a" text-anchor="end">Rpot</text>
    <line x1="88" y1="98" x2="135" y2="98" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="135" cy="98" r="2.5" fill="#dc2626" />
    <text x="142" y="102" font-size="10" font-weight="bold" fill="#dc2626">U_out</text>

    <line x1="80" y1="112" x2="80" y2="120" stroke="#1e293b" stroke-width="1.8" />
    <rect x="72" y="120" width="16" height="20" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="65" y="134" font-size="8" fill="#0f172a" text-anchor="end">Rn</text>

    <line x1="80" y1="140" x2="80" y2="148" stroke="#1e293b" stroke-width="1.8" />
    <text x="80" y="158" font-size="9" fill="#1e293b" text-anchor="middle">GND</text>

    <text x="115" y="174" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Definierter Min- und Max-Bereich</text>
    <text x="115" y="192" font-size="10" fill="#64748b" text-anchor="middle">Schützt vor Übersteuerung</text>
  </g>
</svg>