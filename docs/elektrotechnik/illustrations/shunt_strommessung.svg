<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Messbereichserweiterung für Strom (Shunt)</text>
  <!-- Total current I_ges -->
  <circle cx="50" cy="130" r="4" fill="#16a34a" />
  <line x1="50" y1="130" x2="140" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="80" y="120" font-size="14" font-weight="bold" fill="#16a34a">I_ges</text>
  <!-- Split node 1 -->
  <circle cx="140" cy="130" r="4" fill="#1e293b" />
  <!-- Upper Branch: Meter Movement (Drehspulmesswerk) -->
  <line x1="140" y1="130" x2="140" y2="80" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="80" x2="210" y2="80" stroke="#1e293b" stroke-width="2" />
  <circle cx="230" cy="80" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="230" y="85" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">A</text>
  <text x="230" y="60" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Messwerk R_M, I_M</text>
  <line x1="250" y1="80" x2="320" y2="80" stroke="#1e293b" stroke-width="2" />
  <line x1="320" y1="80" x2="320" y2="130" stroke="#1e293b" stroke-width="2" />
  <!-- Lower Branch: Shunt Resistor R_S -->
  <line x1="140" y1="130" x2="140" y2="180" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="180" x2="200" y2="180" stroke="#1e293b" stroke-width="2" />
  <rect x="200" y="170" width="50" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="225" y="185" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">R_S</text>
  <text x="225" y="210" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Shunt (I_S)</text>
  <line x1="250" y1="180" x2="320" y2="180" stroke="#1e293b" stroke-width="2" />
  <!-- Split node 2 -->
  <circle cx="320" cy="130" r="4" fill="#1e293b" />
  <line x1="320" y1="130" x2="410" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" />
  <circle cx="410" cy="130" r="4" fill="#16a34a" />
  <text x="350" y="120" font-size="14" font-weight="bold" fill="#16a34a">I_ges</text>
  <!-- Formula -->
  <rect x="130" y="220" width="200" height="25" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="230" y="237" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">R_S = R_M / (n − 1),  mit n = I / I_M</text>
</svg>