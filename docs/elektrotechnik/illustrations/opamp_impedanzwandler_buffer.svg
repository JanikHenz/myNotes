<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Operationsverstärker: Impedanzwandler (Spannungsfolger / Buffer)</text>

  <!-- Left: Circuit Diagram -->
  <g transform="translate(30, 55)">
    <!-- OpAmp Triangle -->
    <polygon points="120,50 120,130 190,90" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
    <text x="132" y="73" font-size="16" font-weight="bold" fill="#1e293b">−</text>
    <text x="132" y="113" font-size="16" font-weight="bold" fill="#1e293b">+</text>

    <!-- Non-inverting input (+) from Ue -->
    <line x1="40" y1="108" x2="120" y2="108" stroke="#1e293b" stroke-width="2" />
    <circle cx="40" cy="108" r="3" fill="#2563eb" />
    <text x="25" y="112" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="end">U_e</text>

    <!-- Output wire -->
    <line x1="190" y1="90" x2="260" y2="90" stroke="#1e293b" stroke-width="2" />
    <circle cx="260" cy="90" r="3" fill="#dc2626" />
    <text x="270" y="95" font-size="13" font-weight="bold" fill="#dc2626">U_a</text>

    <!-- 100% Feedback Loop to inverting input (-) -->
    <line x1="225" y1="90" x2="225" y2="35" stroke="#1e293b" stroke-width="2" />
    <line x1="225" y1="35" x2="85" y2="35" stroke="#1e293b" stroke-width="2" />
    <line x1="85" y1="35" x2="85" y2="68" stroke="#1e293b" stroke-width="2" />
    <line x1="85" y1="68" x2="120" y2="68" stroke="#1e293b" stroke-width="2" />

    <!-- Text below circuit -->
    <text x="140" y="160" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">100% Gegenkopplung (k = 1)</text>
  </g>

  <!-- Right: Properties Card -->
  <rect x="320" y="55" width="180" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="332" y="80" font-size="13" font-weight="bold" fill="#0f172a">Eigenschaften:</text>

  <text x="332" y="105" font-size="13" font-weight="bold" fill="#2563eb">U_a = U_e  (v = 1)</text>
  <text x="332" y="125" font-size="11" fill="#334155">Spannungsverstärkung = 1</text>

  <line x1="332" y1="135" x2="485" y2="135" stroke="#e2e8f0" stroke-width="1" />

  <text x="332" y="155" font-size="11" font-weight="bold" fill="#16a34a">R_in → ∞ (sehr hoch)</text>
  <text x="332" y="170" font-size="10" fill="#64748b">Keine Belastung der Quelle</text>

  <text x="332" y="195" font-size="11" font-weight="bold" fill="#16a34a">R_out ≈ 0 (extrem niedrig)</text>
  <text x="332" y="210" font-size="10" fill="#64748b">Kann niederohmige Last treiben</text>
</svg>