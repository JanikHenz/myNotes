<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Invertierender Addierer (Summierverstärker)</text>
  <!-- OpAmp Triangle -->
  <polygon points="230,80 230,200 340,140" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="245" y="115" font-size="16" font-weight="bold" fill="#1e293b">−</text>
  <text x="245" y="175" font-size="16" font-weight="bold" fill="#1e293b">+</text>
  <!-- + to GND -->
  <line x1="200" y1="170" x2="230" y2="170" stroke="#1e293b" stroke-width="2" />
  <line x1="200" y1="170" x2="200" y2="200" stroke="#1e293b" stroke-width="2" />
  <line x1="185" y1="200" x2="215" y2="200" stroke="#1e293b" stroke-width="2" />
  <!-- Inputs U1, U2, U3 -->
  <!-- U1 -->
  <circle cx="50" cy="70" r="4" fill="#16a34a" />
  <text x="30" y="75" font-size="13" font-weight="bold" fill="#16a34a">U₁</text>
  <line x1="50" y1="70" x2="90" y2="70" stroke="#1e293b" stroke-width="2" />
  <rect x="90" y="60" width="35" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="107" y="75" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">R₁</text>
  <line x1="125" y1="70" x2="180" y2="110" stroke="#1e293b" stroke-width="2" />
  <!-- U2 -->
  <circle cx="50" cy="110" r="4" fill="#16a34a" />
  <text x="30" y="115" font-size="13" font-weight="bold" fill="#16a34a">U₂</text>
  <line x1="50" y1="110" x2="90" y2="110" stroke="#1e293b" stroke-width="2" />
  <rect x="90" y="100" width="35" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="107" y="115" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">R₂</text>
  <line x1="125" y1="110" x2="180" y2="110" stroke="#1e293b" stroke-width="2" />
  <!-- Summing node -->
  <circle cx="180" cy="110" r="3.5" fill="#1e293b" />
  <line x1="180" y1="110" x2="230" y2="110" stroke="#1e293b" stroke-width="2" />
  <text x="160" y="130" font-size="11" fill="#64748b">virt. Masse</text>
  <!-- Feedback R_G -->
  <line x1="180" y1="110" x2="180" y2="50" stroke="#1e293b" stroke-width="2" />
  <line x1="180" y1="50" x2="250" y2="50" stroke="#1e293b" stroke-width="2" />
  <rect x="250" y="40" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="270" y="55" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R_G</text>
  <line x1="290" y1="50" x2="380" y2="50" stroke="#1e293b" stroke-width="2" />
  <line x1="380" y1="50" x2="380" y2="140" stroke="#1e293b" stroke-width="2" />
  <!-- Output -->
  <line x1="340" y1="140" x2="440" y2="140" stroke="#2563eb" stroke-width="2" />
  <circle cx="440" cy="140" r="4" fill="#2563eb" />
  <text x="450" y="145" font-size="14" font-weight="bold" fill="#2563eb">U_a</text>
  <!-- Formula -->
  <rect x="180" y="225" width="280" height="35" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="320" y="247" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">U_a = −R_G · (U₁/R₁ + U₂/R₂ + ...)</text>
</svg>