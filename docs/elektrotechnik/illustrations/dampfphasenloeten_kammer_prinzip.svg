<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="vaporGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="400" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Dampfphasenlöten (Vapor Phase Soldering)
  </text>
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Kondensationslöten in einer geschlossenen Prozesskammer bei konstanter Siedetemperatur (kein Überhitzen möglich)
  </text>

  <!-- Enclosure -->
  <rect x="140" y="90" width="520" height="320" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="160" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#475569">Geschlossene Kammer</text>

  <!-- Cooling Coils -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M 170 140 Q 185 130 200 140 T 230 140 T 260 140 T 290 140"/>
    <path d="M 510 140 Q 525 130 540 140 T 570 140 T 600 140 T 630 140"/>
  </g>
  <text x="230" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Kühlzone / Kondensator</text>
  <text x="570" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Kühlzone</text>

  <!-- Vapor Zone -->
  <rect x="150" y="170" width="500" height="170" fill="url(#vaporGrad)"/>
  <text x="400" y="195" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0284c7" text-anchor="middle">
    Dampfphase (Konstante Temperatur T = 230°C)
  </text>

  <!-- PCB in vapor -->
  <rect x="250" y="240" width="300" height="14" rx="2" fill="#15803d" stroke="#14532d" stroke-width="2"/>
  <rect x="280" y="226" width="35" height="14" fill="#1e293b" rx="2"/>
  <rect x="350" y="222" width="60" height="18" fill="#475569" rx="2"/>
  <text x="380" y="215" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">BGA (CPU)</text>
  <!-- Solder balls -->
  <circle cx="360" cy="240" r="2.5" fill="#94a3b8"/>
  <circle cx="370" cy="240" r="2.5" fill="#94a3b8"/>
  <circle cx="380" cy="240" r="2.5" fill="#94a3b8"/>
  <circle cx="390" cy="240" r="2.5" fill="#94a3b8"/>
  <circle cx="400" cy="240" r="2.5" fill="#94a3b8"/>
  <rect x="460" y="220" width="45" height="20" fill="#2563eb" rx="2"/>
  <line x1="470" y1="240" x2="470" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <line x1="495" y1="240" x2="495" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">
    Leiterplatte mit BGA, SMD &amp; THT im Dampf
  </text>

  <!-- Boiling Liquid -->
  <rect x="150" y="340" width="500" height="60" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">
    Siedendes Spezialmedium (z. B. Galden / Perfluorpolyether)
  </text>
  <line x1="200" y1="385" x2="600" y2="385" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="398" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Elektrische Heizstäbe</text>

  <rect x="80" y="425" width="640" height="42" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="445" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#065f46" text-anchor="middle">
    Vorteile: Absolut konstante Temperatur • Überhitzen physikalisch unmöglich • Sauerstofffreie Atmosphäre
  </text>
</svg>