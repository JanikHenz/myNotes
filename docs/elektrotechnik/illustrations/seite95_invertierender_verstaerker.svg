<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Invertierender Operationsverstärker</text>
  <!-- OpAmp Triangle -->
  <polygon points="180,70 180,190 290,130" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5" />
  <text x="195" y="105" font-size="16" font-weight="bold" fill="#1e293b">−</text>
  <text x="195" y="165" font-size="16" font-weight="bold" fill="#1e293b">+</text>
  <!-- + Input to GND -->
  <line x1="140" y1="160" x2="180" y2="160" stroke="#1e293b" stroke-width="2" />
  <line x1="140" y1="160" x2="140" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="125" y1="190" x2="155" y2="190" stroke="#1e293b" stroke-width="2" />
  <!-- Input Ue -> R1 -> (-) -->
  <circle cx="50" cy="100" r="4" fill="#16a34a" />
  <text x="25" y="105" font-size="14" font-weight="bold" fill="#16a34a">U_e</text>
  <line x1="50" y1="100" x2="80" y2="100" stroke="#1e293b" stroke-width="2" />
  <rect x="80" y="90" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="100" y="105" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₁</text>
  <line x1="120" y1="100" x2="180" y2="100" stroke="#1e293b" stroke-width="2" />
  <!-- Feedback R2 -->
  <circle cx="150" cy="100" r="3" fill="#1e293b" />
  <line x1="150" y1="100" x2="150" y2="50" stroke="#1e293b" stroke-width="2" />
  <line x1="150" y1="50" x2="210" y2="50" stroke="#1e293b" stroke-width="2" />
  <rect x="210" y="40" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="230" y="55" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R₂</text>
  <line x1="250" y1="50" x2="330" y2="50" stroke="#1e293b" stroke-width="2" />
  <line x1="330" y1="50" x2="330" y2="130" stroke="#1e293b" stroke-width="2" />
  <!-- Output -->
  <line x1="290" y1="130" x2="420" y2="130" stroke="#2563eb" stroke-width="2" />
  <circle cx="420" cy="130" r="4" fill="#2563eb" />
  <text x="430" y="135" font-size="14" font-weight="bold" fill="#2563eb">U_a</text>
  <!-- Formula -->
  <rect x="270" y="180" width="180" height="40" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="360" y="205" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">U_a = −U_e · (R₂ / R₁)</text>
</svg>