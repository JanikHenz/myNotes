<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Idealer Einphasen-Transformator</text>
  <!-- AC Generator Primary -->
  <circle cx="80" cy="140" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <path d="M 72,140 Q 76,134 80,140 Q 84,146 88,140" fill="none" stroke="#1e293b" stroke-width="2" />
  <!-- Primary Lines -->
  <line x1="80" y1="124" x2="80" y2="90" stroke="#1e293b" stroke-width="2" />
  <line x1="80" y1="90" x2="190" y2="90" stroke="#1e293b" stroke-width="2" />
  <line x1="80" y1="156" x2="80" y2="190" stroke="#1e293b" stroke-width="2" />
  <line x1="80" y1="190" x2="190" y2="190" stroke="#1e293b" stroke-width="2" />
  <text x="65" y="80" font-size="14" font-weight="bold" fill="#16a34a">U₁, I₁</text>
  <!-- Primary Coil N1 -->
  <path d="M 190,90 Q 210,102 190,115 Q 210,127 190,140 Q 210,152 190,165 Q 210,177 190,190" fill="none" stroke="#16a34a" stroke-width="3" />
  <text x="160" y="145" font-size="14" font-weight="bold" fill="#16a34a">N₁</text>
  <!-- Core (Iron) -->
  <line x1="230" y1="80" x2="230" y2="200" stroke="#64748b" stroke-width="3" />
  <line x1="240" y1="80" x2="240" y2="200" stroke="#64748b" stroke-width="3" />
  <text x="235" y="70" font-size="11" fill="#64748b" text-anchor="middle">Kern</text>
  <!-- Secondary Coil N2 -->
  <path d="M 280,90 Q 260,102 280,115 Q 260,127 280,140 Q 260,152 280,165 Q 260,177 280,190" fill="none" stroke="#2563eb" stroke-width="3" />
  <text x="305" y="145" font-size="14" font-weight="bold" fill="#2563eb">N₂</text>
  <!-- Secondary Lines -->
  <line x1="280" y1="90" x2="400" y2="90" stroke="#1e293b" stroke-width="2" />
  <circle cx="400" cy="90" r="4" fill="#2563eb" />
  <line x1="280" y1="190" x2="400" y2="190" stroke="#1e293b" stroke-width="2" />
  <circle cx="400" cy="190" r="4" fill="#2563eb" />
  <text x="410" y="85" font-size="14" font-weight="bold" fill="#2563eb">U₂, I₂</text>
  <!-- Translation Formula Box -->
  <rect x="130" y="215" width="220" height="32" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="240" y="236" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">u = N₁ / N₂ = U₁ / U₂ = I₂ / I₁</text>
</svg>