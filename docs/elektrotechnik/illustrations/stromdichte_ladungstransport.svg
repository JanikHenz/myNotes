<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-el" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-efld" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Elektrischer Strom &amp; Stromdichte (Ladungstransport)</text>

  <!-- Cylindrical Conductor -->
  <g transform="translate(40, 70)">
    <!-- Main Cylinder Body -->
    <rect x="40" y="10" width="220" height="90" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Left Cap (back ellipse) -->
    <ellipse cx="40" cy="55" rx="16" ry="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Right Cap -->
    <ellipse cx="260" cy="55" rx="16" ry="45" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <text x="260" y="58" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>

    <!-- Electric Field E Arrow (Right) -->
    <line x1="60" y1="-5" x2="240" y2="-5" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-efld)" />
    <text x="150" y="-12" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Elektrisches Feld E (techn. Stromrichtung)</text>

    <!-- Electrons moving left (drift velocity v_e) -->
    <g transform="translate(90, 35)">
      <circle cx="0" cy="0" r="7" fill="#3b82f6" />
      <text x="0" y="3" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">−</text>
      <line x1="-8" y1="0" x2="-28" y2="0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-el)" />
    </g>
    <g transform="translate(170, 45)">
      <circle cx="0" cy="0" r="7" fill="#3b82f6" />
      <text x="0" y="3" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">−</text>
      <line x1="-8" y1="0" x2="-28" y2="0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-el)" />
      <text x="-18" y="-8" font-size="10" font-weight="bold" fill="#2563eb">ve</text>
    </g>
    <g transform="translate(130, 75)">
      <circle cx="0" cy="0" r="7" fill="#3b82f6" />
      <text x="0" y="3" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">−</text>
      <line x1="-8" y1="0" x2="-28" y2="0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-el)" />
    </g>

    <!-- Dimension Delta l -->
    <line x1="40" y1="115" x2="260" y2="115" stroke="#64748b" stroke-width="1.5" />
    <line x1="40" y1="110" x2="40" y2="120" stroke="#64748b" stroke-width="1.5" />
    <line x1="260" y1="110" x2="260" y2="120" stroke="#64748b" stroke-width="1.5" />
    <text x="150" y="130" font-size="12" fill="#64748b" text-anchor="middle">Leiterlänge Δl</text>
  </g>

  <!-- Right Info Box -->
  <rect x="330" y="60" width="180" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="342" y="85" font-size="13" font-weight="bold" fill="#0f172a">Formelzusammenhang:</text>
  
  <text x="342" y="110" font-size="12" fill="#2563eb" font-weight="bold">Elektrischer Strom:</text>
  <text x="342" y="126" font-size="12" fill="#334155">I = ΔQ / Δt = n·e / Δt  [A]</text>
  
  <line x1="342" y1="138" x2="500" y2="138" stroke="#e2e8f0" stroke-width="1" />
  
  <text x="342" y="158" font-size="12" fill="#dc2626" font-weight="bold">Volumenstromdichte J:</text>
  <text x="342" y="176" font-size="13" font-weight="bold" fill="#0f172a">J = I / A  [A / m²]</text>
  <text x="342" y="196" font-size="12" fill="#16a34a" font-weight="bold">J = γ · E = ρᵥ · vₑ</text>
  <text x="342" y="218" font-size="10" fill="#64748b">γ = spez. Leitfähigkeit [S/m]</text>
</svg>