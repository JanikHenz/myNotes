<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Lorentzkraft auf freie Ladungsträger im Magnetfeld</text>

  <!-- Left: B-Field Area with Inward B-field crosses -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="280" height="180" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="15" y="22" font-size="12" font-weight="bold" fill="#2563eb">Magnetfeld B (in die Bildebene ⊗)</text>

    <!-- B field crosses grid -->
    <g fill="#93c5fd" font-size="14" font-weight="bold">
      <text x="40" y="55">⊗</text><text x="90" y="55">⊗</text><text x="140" y="55">⊗</text><text x="190" y="55">⊗</text><text x="240" y="55">⊗</text>
      <text x="40" y="95">⊗</text><text x="90" y="95">⊗</text><text x="240" y="95">⊗</text>
      <text x="40" y="135">⊗</text><text x="90" y="135">⊗</text><text x="240" y="135">⊗</text>
      <text x="40" y="170">⊗</text><text x="90" y="170">⊗</text><text x="240" y="170">⊗</text>
    </g>

    <!-- Circular Particle Trajectory -->
    <path d="M 20,150 L 80,150 A 65,65 0 0,0 145,85" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,2" />

    <!-- Charge +q entering -->
    <circle cx="80" cy="150" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="80" y="154" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">+q</text>

    <!-- Velocity Vector v -->
    <line x1="90" y1="150" x2="135" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="115" y="142" font-size="11" font-weight="bold" fill="#2563eb">v</text>

    <!-- Lorentz force vector FL (upward to center) -->
    <line x1="80" y1="140" x2="80" y2="95" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)" />
    <text x="88" y="115" font-size="11" font-weight="bold" fill="#dc2626">F_L</text>

    <!-- Radius arrow -->
    <line x1="145" y1="150" x2="145" y2="85" stroke="#64748b" stroke-width="1.5" />
    <rect x="150" y="108" width="55" height="17" rx="3" fill="#f8fafc" />
    <text x="155" y="121" font-size="11" font-weight="bold" fill="#475569">Radius r</text>
  </g>

  <!-- Right Info Card -->
  <rect x="330" y="55" width="190" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="342" y="80" font-size="13" font-weight="bold" fill="#0f172a">Formel &amp; Gesetz:</text>
  
  <text x="342" y="104" font-size="12" fill="#dc2626" font-weight="bold">Lorentzkraft F_L:</text>
  <text x="342" y="122" font-size="13" font-weight="bold" fill="#0f172a">F = q · (v × B)</text>
  <text x="342" y="140" font-size="11" fill="#334155">Betrag: F = q · v · B · sin(α)</text>
  
  <line x1="342" y1="152" x2="505" y2="152" stroke="#e2e8f0" stroke-width="1" />
  
  <text x="342" y="172" font-size="12" fill="#2563eb" font-weight="bold">Kreisbahn (F_L = F_Z):</text>
  <text x="342" y="190" font-size="12" font-weight="bold" fill="#0f172a">r = (m · v) / (q · B)</text>
  <text x="342" y="214" font-size="10" fill="#64748b">Rechte-Hand-Regel für +q</text>
  <text x="342" y="230" font-size="10" fill="#64748b">Linke-Hand-Regel für -e (Elektron)</text>
</svg>