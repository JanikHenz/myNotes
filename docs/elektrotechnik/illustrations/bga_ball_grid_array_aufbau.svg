<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="400" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    BGA (Ball Grid Array) – Aufbau &amp; Lötverbindung
  </text>
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Flächige Kugelgitteranordnung auf der Gehäuseunterseite (z. B. Prozessoren &amp; FPGAs)
  </text>

  <!-- Left: Side view -->
  <rect x="50" y="90" width="370" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="235" y="120" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Seitenansicht (Querschnitt)</text>

  <!-- IC Housing -->
  <rect x="100" y="150" width="270" height="45" rx="4" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <text x="235" y="178" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU / IC-Baustein</text>

  <!-- Solder Balls -->
  <g fill="#64748b" stroke="#334155" stroke-width="1.5">
    <circle cx="120" cy="215" r="9"/><circle cx="150" cy="215" r="9"/><circle cx="180" cy="215" r="9"/>
    <circle cx="210" cy="215" r="9"/><circle cx="240" cy="215" r="9"/><circle cx="270" cy="215" r="9"/>
    <circle cx="300" cy="215" r="9"/><circle cx="330" cy="215" r="9"/><circle cx="350" cy="215" r="9"/>
  </g>
  <text x="235" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Lötkugeln (Solder Balls)</text>

  <!-- PCB -->
  <rect x="80" y="260" width="310" height="24" rx="2" fill="#15803d" stroke="#166534" stroke-width="2"/>
  <text x="235" y="277" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Trägerplatine (PCB)</text>

  <g fill="#d97706">
    <rect x="113" y="256" width="14" height="4"/><rect x="143" y="256" width="14" height="4"/>
    <rect x="173" y="256" width="14" height="4"/><rect x="203" y="256" width="14" height="4"/>
    <rect x="233" y="256" width="14" height="4"/><rect x="263" y="256" width="14" height="4"/>
    <rect x="293" y="256" width="14" height="4"/><rect x="323" y="256" width="14" height="4"/>
    <rect x="343" y="256" width="14" height="4"/>
  </g>

  <text x="235" y="330" font-family="system-ui, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Oberflächenspannung zentriert</text>
  <text x="235" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">das Bauteil selbstständig!</text>

  <!-- Right: Top View Matrix -->
  <rect x="450" y="90" width="300" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="120" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Draufsicht Unterseite (Array)</text>
  <rect x="480" y="145" width="240" height="240" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <g fill="#475569" stroke="#1e293b" stroke-width="1">
    <circle cx="515" cy="180" r="7"/><circle cx="545" cy="180" r="7"/><circle cx="575" cy="180" r="7"/><circle cx="625" cy="180" r="7"/><circle cx="655" cy="180" r="7"/><circle cx="685" cy="180" r="7"/>
    <circle cx="515" cy="210" r="7"/><circle cx="545" cy="210" r="7"/><circle cx="575" cy="210" r="7"/><circle cx="625" cy="210" r="7"/><circle cx="655" cy="210" r="7"/><circle cx="685" cy="210" r="7"/>
    <circle cx="515" cy="240" r="7"/><circle cx="545" cy="240" r="7"/><circle cx="655" cy="240" r="7"/><circle cx="685" cy="240" r="7"/>
    <circle cx="515" cy="280" r="7"/><circle cx="545" cy="280" r="7"/><circle cx="655" cy="280" r="7"/><circle cx="685" cy="280" r="7"/>
    <circle cx="515" cy="320" r="7"/><circle cx="545" cy="320" r="7"/><circle cx="575" cy="320" r="7"/><circle cx="625" cy="320" r="7"/><circle cx="655" cy="320" r="7"/><circle cx="685" cy="320" r="7"/>
    <circle cx="515" cy="350" r="7"/><circle cx="545" cy="350" r="7"/><circle cx="575" cy="350" r="7"/><circle cx="625" cy="350" r="7"/><circle cx="655" cy="350" r="7"/><circle cx="685" cy="350" r="7"/>
  </g>
  <text x="600" y="410" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Sehr hohe Pindichte bei minimalem Platz</text>
</svg>