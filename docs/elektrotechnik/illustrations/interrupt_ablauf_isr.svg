<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 550 260"
   width="100%"
   height="100%"
   style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;"
   version="1.1"
   id="svg13"
   sodipodi:docname="interrupt_ablauf_isr.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview13"
     pagecolor="#ffffff"
     bordercolor="#999999"
     borderopacity="1"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="4.3"
     inkscape:cx="219.18605"
     inkscape:cy="130"
     inkscape:window-width="2560"
     inkscape:window-height="1371"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="g10" />
  <defs
     id="defs3">
    <marker
       id="arr-main"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0 1 L 10 5 L 0 9 z"
         fill="#2563eb"
         id="path1" />
    </marker>
    <marker
       id="arr-isr"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0 1 L 10 5 L 0 9 z"
         fill="#dc2626"
         id="path2" />
    </marker>
    <marker
       id="arr-ret"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0 1 L 10 5 L 0 9 z"
         fill="#16a34a"
         id="path3" />
    </marker>
  </defs>
  <text
     x="20"
     y="30"
     font-size="16"
     font-weight="bold"
     fill="#0f172a"
     id="text3">Mikrocontroller: Ablauf einer Interrupt Service Routine (ISR)</text>
  <!-- Main Program Timeline (Horizontal Blue) -->
  <g
     transform="translate(30, 80)"
     id="g10">
    <text
       x="0"
       y="-12"
       font-size="12"
       font-weight="bold"
       fill="#2563eb"
       id="text4">Hauptprogramm (main loop):</text>
    <!-- Phase 1: running -->
    <rect
       x="0"
       y="0"
       width="130"
       height="24"
       rx="4"
       fill="#dbeafe"
       stroke="#2563eb"
       stroke-width="1.5"
       id="rect4" />
    <text
       x="65"
       y="16"
       font-size="10"
       font-weight="bold"
       fill="#1e40af"
       text-anchor="middle"
       id="text5">Befehle abarbeiten</text>
    <!-- Interrupt Event (Flash / Bolt) -->
    <circle
       cx="145"
       cy="12"
       r="12"
       fill="#fee2e2"
       stroke="#dc2626"
       stroke-width="2"
       id="circle5" />
    <text
       x="145"
       y="16"
       font-size="11"
       font-weight="bold"
       fill="#dc2626"
       text-anchor="middle"
       id="text6">⚡</text>
    <!-- Jump to ISR arrow -->
    <path
       d="m 155,12 c 18.03372,0 21.89605,22.461952 34.55679,37.831371 C 194.44753,55.768455 202.10558,57.093023 210,65"
       fill="none"
       stroke="#dc2626"
       stroke-width="2"
       stroke-dasharray="3, 2"
       marker-end="url(#arr-isr)"
       id="path6"
       sodipodi:nodetypes="csc" />
    <text
       x="195"
       y="45"
       font-size="9"
       font-weight="bold"
       fill="#dc2626"
       id="text7">Kontext auf Stack</text>
    <!-- Paused section (dashed) -->
    <rect
       x="160"
       y="0"
       width="160"
       height="24"
       rx="4"
       fill="#f1f5f9"
       stroke="#94a3b8"
       stroke-dasharray="4,3"
       id="rect7" />
    <text
       x="240"
       y="16"
       font-size="10"
       fill="#94a3b8"
       text-anchor="middle"
       id="text8">Hauptprogramm pausiert</text>
    <!-- Phase 2: Resume -->
    <rect
       x="340"
       y="0"
       width="130"
       height="24"
       rx="4"
       fill="#dbeafe"
       stroke="#2563eb"
       stroke-width="1.5"
       id="rect8" />
    <text
       x="405"
       y="16"
       font-size="10"
       font-weight="bold"
       fill="#1e40af"
       text-anchor="middle"
       id="text9">Fortsetzung nahtlos</text>
    <!-- Return arrow from ISR (RETI) -->
    <path
       d="m 310,65 c 20,0 -3.49075,-30.348201 30,-53"
       fill="none"
       stroke="#16a34a"
       stroke-width="2"
       marker-end="url(#arr-ret)"
       id="path9"
       sodipodi:nodetypes="cc" />
    <text
       x="330"
       y="48"
       font-size="9"
       font-weight="bold"
       fill="#16a34a"
       id="text10">RETI</text>
  </g>
  <!-- ISR Block (Lower Level Red) -->
  <g
     transform="translate(230, 145)"
     id="g12">
    <rect
       x="0"
       y="0"
       width="120"
       height="45"
       rx="5"
       fill="#fee2e2"
       stroke="#dc2626"
       stroke-width="2"
       id="rect10" />
    <text
       x="60"
       y="18"
       font-size="11"
       font-weight="bold"
       fill="#b91c1c"
       text-anchor="middle"
       id="text11">ISR(TIMER_vect)</text>
    <text
       x="60"
       y="34"
       font-size="9"
       fill="#7f1d1d"
       text-anchor="middle"
       id="text12">Kurz &amp; präzise!</text>
  </g>
  <!-- Summary at Bottom -->
  <rect
     x="30"
     y="215"
     width="490"
     height="25"
     rx="4"
     fill="#f8fafc"
     stroke="#cbd5e1"
     id="rect12" />
  <text
     x="275"
     y="232"
     font-size="11"
     font-weight="bold"
     fill="#0f172a"
     text-anchor="middle"
     id="text13">Wichtig: In der ISR niemals lange Delays oder blockierende Funktionen aufrufen!</text>
</svg>
