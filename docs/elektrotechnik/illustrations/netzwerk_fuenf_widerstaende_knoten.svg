<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Netzwerkknoten &amp; Bilanzierung über Hüllfläche (1. Kirchhoff)</text>

  <!-- Left: 5 Resistors Circuit with Enclosed Surface -->
  <g transform="translate(30, 55)">
    <!-- Source left -->
    <line x1="20" y1="95" x2="50" y2="95" stroke="#1e293b" stroke-width="2" />
    <circle cx="20" cy="95" r="12" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="99" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">U₀</text>

    <!-- Branching to network -->
    <line x1="50" y1="50" x2="50" y2="140" stroke="#1e293b" stroke-width="2" />
    <line x1="50" y1="95" x2="50" y2="50" stroke="#1e293b" stroke-width="2" />

    <!-- Top Resistor R1 -->
    <line x1="50" y1="50" x2="80" y2="50" stroke="#1e293b" stroke-width="2" />
    <rect x="80" y="42" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="97" y="54" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">R₁</text>
    <line x1="115" y1="50" x2="160" y2="50" stroke="#1e293b" stroke-width="2" />

    <!-- Bottom Resistor R2 -->
    <line x1="50" y1="140" x2="80" y2="140" stroke="#1e293b" stroke-width="2" />
    <rect x="80" y="132" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="97" y="144" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">R₂</text>
    <line x1="115" y1="140" x2="160" y2="140" stroke="#1e293b" stroke-width="2" />

    <!-- Bridge Resistor R5 (vertical) -->
    <line x1="160" y1="50" x2="160" y2="80" stroke="#1e293b" stroke-width="2" />
    <rect x="152" y="80" width="16" height="30" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="175" y="98" font-size="9" font-weight="bold" fill="#0f172a">R₅</text>
    <line x1="160" y1="110" x2="160" y2="140" stroke="#1e293b" stroke-width="2" />

    <!-- Right Resistors R3 & R4 -->
    <line x1="160" y1="50" x2="190" y2="50" stroke="#1e293b" stroke-width="2" />
    <rect x="190" y="42" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="207" y="54" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">R₃</text>
    <line x1="225" y1="50" x2="250" y2="50" stroke="#1e293b" stroke-width="2" />

    <line x1="160" y1="140" x2="190" y2="140" stroke="#1e293b" stroke-width="2" />
    <rect x="190" y="132" width="35" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <text x="207" y="144" font-size="9" font-weight="bold" fill="#0f172a" text-anchor="middle">R₄</text>
    <line x1="225" y1="140" x2="250" y2="140" stroke="#1e293b" stroke-width="2" />

    <line x1="250" y1="50" x2="250" y2="140" stroke="#1e293b" stroke-width="2" />

    <!-- Green Dashed Enclosure Boundary (Hüllfläche) enclosing right nodes -->
    <ellipse cx="185" cy="95" rx="65" ry="75" fill="#dcfce7" fill-opacity="0.25" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4" />
    <text x="185" y="185" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Hüllfläche (Superknoten)</text>
  </g>

  <!-- Right: Law Explanation -->
  <rect x="320" y="55" width="200" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="335" y="80" font-size="13" font-weight="bold" fill="#0f172a">Knotensatz erweitert:</text>

  <text x="335" y="105" font-size="12" fill="#16a34a" font-weight="bold">Bilanz an Hüllflächen:</text>
  <text x="335" y="125" font-size="12" font-weight="bold" fill="#0f172a">Σ I_ein = Σ I_aus</text>
  <text x="335" y="145" font-size="11" fill="#334155">Die Summe aller in eine</text>
  <text x="335" y="160" font-size="11" fill="#334155">geschlossene Hüllfläche fließenden</text>
  <text x="335" y="175" font-size="11" fill="#334155">Ströme ist gleich Null.</text>

  <line x1="335" y1="188" x2="505" y2="188" stroke="#e2e8f0" stroke-width="1" />
  <text x="335" y="210" font-size="10" fill="#64748b">Gilt für beliebige Teilnetzwerke,</text>
  <text x="335" y="224" font-size="10" fill="#64748b">Brückenschaltungen und ICs.</text>
</svg>