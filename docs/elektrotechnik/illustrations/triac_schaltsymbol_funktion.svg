<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <text x="410" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Triac (TRIODE FOR ALTERNATING CURRENT)
  </text>
  <text x="410" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Bidirektionaler Thyristor für Wechselspannung mit Schaltsymbol &amp; antiparallelem Ersatzschaltbild
  </text>

  <!-- Left: Symbol -->
  <rect x="50" y="85" width="340" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Triac Schaltsymbol</text>

  <line x1="220" y1="150" x2="220" y2="190" stroke="#1e293b" stroke-width="3"/>
  <circle cx="220" cy="150" r="5" fill="#1e293b"/>
  <text x="220" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">A₂ (MT2)</text>

  <!-- Antiparallel triangles -->
  <polygon points="205,190 235,190 220,225" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="205" y1="225" x2="235" y2="225" stroke="#1d4ed8" stroke-width="3"/>

  <polygon points="205,245 235,245 220,210" fill="#059669" stroke="#047857" stroke-width="2"/>
  <line x1="205" y1="210" x2="235" y2="210" stroke="#047857" stroke-width="3"/>

  <line x1="220" y1="245" x2="220" y2="305" stroke="#1e293b" stroke-width="3"/>
  <circle cx="220" cy="305" r="5" fill="#1e293b"/>
  <text x="220" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">A₁ (MT1)</text>

  <!-- Gate -->
  <line x1="220" y1="245" x2="160" y2="280" stroke="#dc2626" stroke-width="3"/>
  <line x1="160" y1="280" x2="120" y2="280" stroke="#dc2626" stroke-width="3"/>
  <circle cx="120" cy="280" r="5" fill="#dc2626"/>
  <text x="110" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="end">G (Gate)</text>

  <!-- Right: Equivalent -->
  <rect x="420" y="85" width="350" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="595" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Ersatzschaltung: 2 Thyristoren</text>

  <line x1="595" y1="150" x2="595" y2="170" stroke="#1e293b" stroke-width="3"/>
  <circle cx="595" cy="150" r="5" fill="#1e293b"/>
  <text x="595" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">A₂</text>

  <line x1="530" y1="170" x2="660" y2="170" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Thyristor 1 -->
  <line x1="530" y1="170" x2="530" y2="195" stroke="#1e293b" stroke-width="2"/>
  <polygon points="515,195 545,195 530,225" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="515" y1="225" x2="545" y2="225" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="530" y1="225" x2="530" y2="270" stroke="#1e293b" stroke-width="2"/>
  <line x1="530" y1="225" x2="505" y2="245" stroke="#dc2626" stroke-width="2"/>

  <!-- Thyristor 2 -->
  <line x1="660" y1="170" x2="660" y2="215" stroke="#1e293b" stroke-width="2"/>
  <line x1="645" y1="215" x2="675" y2="215" stroke="#047857" stroke-width="2.5"/>
  <polygon points="645,245 675,245 660,215" fill="#059669" stroke="#047857" stroke-width="2"/>
  <line x1="660" y1="245" x2="660" y2="270" stroke="#1e293b" stroke-width="2"/>
  <line x1="660" y1="215" x2="685" y2="235" stroke="#dc2626" stroke-width="2"/>

  <line x1="530" y1="270" x2="660" y2="270" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="595" y1="270" x2="595" y2="305" stroke="#1e293b" stroke-width="3"/>
  <circle cx="595" cy="305" r="5" fill="#1e293b"/>
  <text x="595" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">A₁</text>

  <text x="595" y="375" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Löschbedingung:</text>
  <text x="595" y="400" font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Sperrt erst wieder beim Nulldurchgang der Spannung (U_D = 0)</text>
</svg>