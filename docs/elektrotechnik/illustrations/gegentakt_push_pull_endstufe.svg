<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Komplementäre Gegentakt-Endstufe (Push-Pull Class AB)</text>

  <!-- Left: Circuit Diagram -->
  <g transform="translate(30, 50)">
    <!-- +Vcc Rail -->
    <line x1="100" y1="15" x2="180" y2="15" stroke="#dc2626" stroke-width="2" />
    <text x="190" y="19" font-size="11" font-weight="bold" fill="#dc2626">+V_CC</text>

    <!-- Top Transistor NPN (T1) -->
    <line x1="140" y1="15" x2="140" y2="40" stroke="#1e293b" stroke-width="2" />
    <rect x="130" y="40" width="20" height="25" fill="#f8fafc" stroke="#1e293b" />
    <text x="140" y="56" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">NPN</text>
    <text x="160" y="50" font-size="10" font-weight="bold" fill="#2563eb">T₁ (+)</text>

    <!-- Output Junction -->
    <line x1="140" y1="65" x2="140" y2="125" stroke="#1e293b" stroke-width="2" />
    <circle cx="140" cy="95" r="3" fill="#1e293b" />
    
    <!-- Load Resistor RL to GND -->
    <line x1="140" y1="95" x2="210" y2="95" stroke="#1e293b" stroke-width="2" />
    <rect x="210" y="87" width="30" height="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" />
    <text x="225" y="80" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">R_L</text>
    <line x1="240" y1="95" x2="260" y2="95" stroke="#1e293b" stroke-width="2" />
    <line x1="260" y1="88" x2="260" y2="102" stroke="#1e293b" stroke-width="2" />

    <!-- Bottom Transistor PNP (T2) -->
    <rect x="130" y="125" width="20" height="25" fill="#f8fafc" stroke="#1e293b" />
    <text x="140" y="141" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">PNP</text>
    <text x="160" y="145" font-size="10" font-weight="bold" fill="#dc2626">T₂ (−)</text>

    <!-- -Vee Rail -->
    <line x1="140" y1="150" x2="140" y2="175" stroke="#1e293b" stroke-width="2" />
    <line x1="100" y1="175" x2="180" y2="175" stroke="#2563eb" stroke-width="2" />
    <text x="190" y="179" font-size="11" font-weight="bold" fill="#2563eb">−V_EE</text>

    <!-- Input Signal -->
    <line x1="60" y1="95" x2="110" y2="95" stroke="#1e293b" stroke-width="2" />
    <circle cx="60" cy="95" r="3" fill="#16a34a" />
    <text x="45" y="99" font-size="11" font-weight="bold" fill="#16a34a">U_in</text>
    <line x1="110" y1="52" x2="130" y2="52" stroke="#1e293b" stroke-width="1.5" />
    <line x1="110" y1="138" x2="130" y2="138" stroke="#1e293b" stroke-width="1.5" />
    <line x1="110" y1="52" x2="110" y2="138" stroke="#1e293b" stroke-width="1.5" />
  </g>

  <!-- Right: Waveforms & Explanation -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="180" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="90" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Wirkungsweise:</text>

    <text x="15" y="55" font-size="11" font-weight="bold" fill="#2563eb">T₁ (NPN):</text>
    <text x="15" y="72" font-size="10" fill="#334155">Verstärkt positive</text>
    <text x="15" y="85" font-size="10" fill="#334155">Halbwelle (Push)</text>

    <line x1="15" y1="98" x2="165" y2="98" stroke="#e2e8f0" stroke-width="1" />

    <text x="15" y="120" font-size="11" font-weight="bold" fill="#dc2626">T₂ (PNP):</text>
    <text x="15" y="137" font-size="10" fill="#334155">Verstärkt negative</text>
    <text x="15" y="150" font-size="10" fill="#334155">Halbwelle (Pull)</text>

    <text x="90" y="175" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">Sehr hoher Wirkungsgrad!</text>
  </g>
</svg>