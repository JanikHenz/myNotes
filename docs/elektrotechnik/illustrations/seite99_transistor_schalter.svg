<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Bipolartransistor (NPN) als elektronischer Schalter</text>
  <!-- Supply V_CC -->
  <text x="300" y="55" font-size="13" font-weight="bold" fill="#dc2626">+V_CC (z.B. 12V / 5V)</text>
  <line x1="280" y1="60" x2="280" y2="85" stroke="#1e293b" stroke-width="2" />
  <!-- Load (Relais / LED / R_C) -->
  <rect x="268" y="85" width="24" height="40" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="302" y="110" font-size="12" font-weight="bold" fill="#0f172a">Last (R_C)</text>
  <line x1="280" y1="125" x2="280" y2="150" stroke="#1e293b" stroke-width="2" />
  <!-- NPN Transistor -->
  <circle cx="270" cy="165" r="22" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <line x1="258" y1="150" x2="258" y2="180" stroke="#1e293b" stroke-width="3" />
  <line x1="280" y1="150" x2="258" y2="158" stroke="#1e293b" stroke-width="2" />
  <line x1="258" y1="172" x2="280" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-dark)" />
  <line x1="280" y1="180" x2="280" y2="230" stroke="#1e293b" stroke-width="2" />
  <!-- GND -->
  <line x1="265" y1="230" x2="295" y2="230" stroke="#1e293b" stroke-width="2" />
  <!-- Base Connection -->
  <line x1="210" y1="165" x2="258" y2="165" stroke="#1e293b" stroke-width="2" />
  <rect x="150" y="155" width="40" height="20" fill="#f8fafc" stroke="#1e293b" stroke-width="2" />
  <text x="170" y="170" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">R_B</text>
  <line x1="70" y1="165" x2="150" y2="165" stroke="#16a34a" stroke-width="2" />
  <circle cx="70" cy="165" r="4" fill="#16a34a" />
  <text x="40" y="160" font-size="13" font-weight="bold" fill="#16a34a">U_in (µC)</text>
  <text x="35" y="178" font-size="11" fill="#64748b">0V / 3.3V / 5V</text>
  <!-- Overdrive Note -->
  <rect x="50" y="210" width="180" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="60" y="228" font-size="11" font-weight="bold" fill="#1e40af">Übersteuerungsfaktor ü = 2...5</text>
  <text x="60" y="243" font-size="11" fill="#1e40af">I_B = ü · (I_C / B)</text>
</svg>