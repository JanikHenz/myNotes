<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Funktionsprinzip des Drehspulmesswerks</text>

  <!-- Left: Schematic Mechanical Construction -->
  <g transform="translate(40, 50)">
    <!-- Permanent Magnet Poles (North Left red, South Right blue) -->
    <path d="M 20,40 L 55,40 A 45,45 0 0,1 55,140 L 20,140 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" />
    <text x="35" y="95" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">N</text>

    <path d="M 180,40 L 145,40 A 45,45 0 0,0 145,140 L 180,140 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" />
    <text x="165" y="95" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">S</text>

    <!-- Cylindrical Soft Iron Core -->
    <circle cx="100" cy="90" r="28" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="94" font-size="9" fill="#334155" text-anchor="middle">Eisenkern</text>

    <!-- Rotatable Coil (Drehspule) around core -->
    <rect x="70" y="60" width="60" height="60" rx="4" fill="none" stroke="#ea580c" stroke-width="2.5" />
    <text x="100" y="52" font-size="9" font-weight="bold" fill="#ea580c" text-anchor="middle">Drehspule (I)</text>

    <!-- Pointer (Zeiger) -->
    <line x1="100" y1="90" x2="135" y2="20" stroke="#1e293b" stroke-width="2" />
    <circle cx="100" cy="90" r="4" fill="#1e293b" />

    <!-- Scale Arc at Top -->
    <path d="M 80,25 A 70,70 0 0,1 150,25" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <line x1="80" y1="25" x2="83" y2="21" stroke="#1e293b" stroke-width="1.5" /><text x="75" y="22" font-size="8">0</text>
    <line x1="115" y1="18" x2="115" y2="13" stroke="#1e293b" stroke-width="1.5" />
    <line x1="150" y1="25" x2="147" y2="21" stroke="#1e293b" stroke-width="1.5" /><text x="155" y="22" font-size="8">max</text>
  </g>

  <!-- Right: Physical Equation & Operation -->
  <rect x="260" y="50" width="255" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="275" y="75" font-size="12" font-weight="bold" fill="#0f172a">Drehmoment &amp; Ausschlag:</text>

  <text x="275" y="100" font-size="11" fill="#2563eb" font-weight="bold">Elektrisches Drehmoment:</text>
  <text x="275" y="118" font-size="12" font-weight="bold" fill="#0f172a">M_el = B · I · A · N</text>

  <text x="275" y="138" font-size="11" fill="#16a34a" font-weight="bold">Mechanisches Gegenmoment:</text>
  <text x="275" y="154" font-size="12" font-weight="bold" fill="#0f172a">M_mech = D · α  (Spiralfeder)</text>

  <line x1="275" y1="168" x2="500" y2="168" stroke="#e2e8f0" stroke-width="1" />

  <text x="275" y="188" font-size="12" font-weight="bold" fill="#dc2626">Gleichgewicht M_el = M_mech:</text>
  <text x="275" y="208" font-size="13" font-weight="bold" fill="#2563eb">α = (B · A · N / D) · I ⇒ α ~ I</text>
  <text x="275" y="226" font-size="10" fill="#64748b">Lineare Skala! Misst nur Gleichstrom (DC).</text>
</svg>