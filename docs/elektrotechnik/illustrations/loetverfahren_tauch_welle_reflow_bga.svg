<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 270" width="100%" height="100%" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-family:system-ui,-apple-system,sans-serif;">
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Lötverfahren der Elektronikfertigung</text>

  <!-- 1. Tauchlöten -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="115" height="195" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Tauchlöten</text>
    
    <!-- Pot with molten solder -->
    <rect x="15" y="80" width="85" height="40" fill="#94a3b8" stroke="#475569" stroke-width="1.2" />
    <text x="57" y="105" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">Zinnbad</text>

    <!-- PCB lowered into bath -->
    <rect x="25" y="55" width="65" height="6" fill="#16a34a" />
    <!-- THT pins dipping in -->
    <line x1="40" y1="61" x2="40" y2="85" stroke="#ea580c" stroke-width="2" />
    <line x1="75" y1="61" x2="75" y2="85" stroke="#ea580c" stroke-width="2" />
    <!-- Down arrow -->
    <line x1="57" y1="35" x2="57" y2="50" stroke="#dc2626" stroke-width="2" />

    <text x="57" y="145" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">Manuell / Kleinserie</text>
    <text x="57" y="165" font-size="9" fill="#64748b" text-anchor="middle">Platine wird</text>
    <text x="57" y="178" font-size="9" fill="#64748b" text-anchor="middle">eingetaucht</text>
  </g>

  <!-- 2. Wellenlöten -->
  <g transform="translate(155, 55)">
    <rect x="0" y="0" width="115" height="195" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Wellenlöten</text>
    
    <!-- Solder basin & pumped wave -->
    <rect x="15" y="95" width="85" height="25" fill="#94a3b8" stroke="#475569" stroke-width="1.2" />
    <path d="M 35,95 Q 57,68 80,95 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
    <text x="57" y="112" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">Zinnwelle</text>

    <!-- PCB moving horizontally -->
    <rect x="10" y="60" width="95" height="6" fill="#16a34a" />
    <line x1="10" y1="52" x2="35" y2="52" stroke="#dc2626" stroke-width="2" />

    <text x="57" y="145" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">THT-Serienfertigung</text>
    <text x="57" y="165" font-size="9" fill="#64748b" text-anchor="middle">Platine fährt über</text>
    <text x="57" y="178" font-size="9" fill="#64748b" text-anchor="middle">gepumpte Welle</text>
  </g>

  <!-- 3. Reflowlöten -->
  <g transform="translate(285, 55)">
    <rect x="0" y="0" width="115" height="195" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Reflowlöten</text>
    
    <!-- PCB with SMD part -->
    <rect x="15" y="90" width="85" height="6" fill="#16a34a" />
    <!-- Solder paste pads -->
    <rect x="30" y="85" width="12" height="5" fill="#94a3b8" />
    <rect x="73" y="85" width="12" height="5" fill="#94a3b8" />
    <!-- SMD Chip -->
    <rect x="33" y="70" width="49" height="15" rx="2" fill="#1e293b" />
    <text x="57" y="82" font-size="8" fill="#ffffff" text-anchor="middle">SMD</text>

    <!-- Heat / IR / Hot Air -->
    <path d="M 45,45 Q 50,55 45,65 M 57,45 Q 62,55 57,65 M 69,45 Q 74,55 69,65" fill="none" stroke="#ef4444" stroke-width="1.8" />
    <text x="57" y="40" font-size="9" font-weight="bold" fill="#ef4444" text-anchor="middle">Heißluft / IR</text>

    <text x="57" y="145" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">SMD-Standard</text>
    <text x="57" y="165" font-size="9" fill="#64748b" text-anchor="middle">Lotpaste schmilzt</text>
    <text x="57" y="178" font-size="9" fill="#64748b" text-anchor="middle">im Reflow-Ofen</text>
  </g>

  <!-- 4. BGA -->
  <g transform="translate(415, 55)">
    <rect x="0" y="0" width="115" height="195" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="57" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Ball Grid Array</text>
    
    <!-- IC / CPU package -->
    <rect x="20" y="55" width="75" height="18" rx="2" fill="#0f172a" />
    <text x="57" y="68" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU / BGA</text>

    <!-- Solder balls -->
    <circle cx="32" cy="82" r="4.5" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <circle cx="48" cy="82" r="4.5" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <circle cx="66" cy="82" r="4.5" fill="#94a3b8" stroke="#475569" stroke-width="1" />
    <circle cx="82" cy="82" r="4.5" fill="#94a3b8" stroke="#475569" stroke-width="1" />

    <!-- PCB board -->
    <rect x="15" y="92" width="85" height="6" fill="#16a34a" />

    <text x="57" y="145" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">Höchste Pindichte</text>
    <text x="57" y="165" font-size="9" fill="#64748b" text-anchor="middle">Lötkugeln unter</text>
    <text x="57" y="178" font-size="9" fill="#64748b" text-anchor="middle">dem Gehäuse</text>
  </g>
</svg>